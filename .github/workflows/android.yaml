name: Android
on:
  pull_request:
    paths: ['android/**', '.github/actions/setup-pnpm/**', .github/workflows/android.yaml, 'scripts/android-*.mjs', scripts/resolve-android-release.mjs, 'tests/android-*.test.mjs']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/actions/setup-pnpm/**', .github/workflows/android.yaml, 'scripts/android-*.mjs', scripts/resolve-android-release.mjs, 'tests/android-*.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run-id: ${{ steps.resolve.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-android-release.mjs
  check:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check Kotlin formatting
        working-directory: android
        run: ./gradlew spotlessCheck --no-daemon
      - name: Use the tag version for a fresh release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf 'LEO_ANDROID_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test, lint and build debug
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # These history tests take about half of the device-test time. The other
      # device classes run on a second emulator while captures stay here.
      - name: Check history and capture controls on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.leo.manager.ui.HistoryFollowDeviceTest --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Gradle uninstalls the test app, so regenerate the captures after reinstalling.
            adb shell am instrument -w -e class 'dev.leo.manager.ui.HistoryFollowDeviceTest#oversizedFinalMessageStillReachesTheBottomAfterStreamingAndResize,dev.leo.manager.ui.ModelPickerDeviceTest#selectionSurvivesRecreationAndModelChangeResetsEffort,dev.leo.manager.ui.ConversationLifecycleDeviceTest#swipeFromFilTrashesWithUndoWithoutOpeningTheConversation' dev.leo.manager.test/androidx.test.runner.AndroidJUnitRunner > android/app/build/reports/capture-instrumentation.txt
            adb exec-out run-as dev.leo.manager cat files/scroll-validation/pinned-stream.png > android/app/build/reports/pinned-stream.png
            adb exec-out run-as dev.leo.manager cat files/model-picker/reasoning.png > android/app/build/reports/reasoning-picker.png
            adb exec-out run-as dev.leo.manager cat files/conversation-lifecycle/swipe-fil.png > android/app/build/reports/swipe-fil.png
            python3 -c 'from pathlib import Path; p = Path("android/app/build/reports"); assert "OK (3 tests)" in (p / "capture-instrumentation.txt").read_text(); assert all((p / name).read_bytes()[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]) for name in ("pinned-stream.png", "reasoning-picker.png", "swipe-fil.png"))'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: leo-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/pinned-stream.png
            android/app/build/reports/reasoning-picker.png
            android/app/build/reports/swipe-fil.png
            android/app/build/reports/capture-instrumentation.txt
          retention-days: 14

  device-extra:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Use the tag version for a fresh release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf 'LEO_ANDROID_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build debug and instrumentation APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the remaining Android controls
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.leo.manager.ui.ModelPickerDeviceTest,dev.leo.manager.ui.AccountsDeviceTest,dev.leo.manager.ui.ModelCatalogDeviceTest,dev.leo.manager.ui.ChatProviderDeviceTest,dev.leo.manager.ui.SkillMentionDeviceTest,dev.leo.manager.ui.ConversationLifecycleDeviceTest,dev.leo.manager.ui.ImagePasteDeviceTest,dev.leo.manager.ui.QueueStripDeviceTest,dev.leo.manager.ui.NodePlacementDeviceTest,dev.leo.manager.ui.MissionBackDeviceTest --no-daemon
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: leo-android-other-tests
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14

  release:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Use the tag version for a fresh release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf 'LEO_ANDROID_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build optimized release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      # The workflow only succeeds when this build and the device checks pass.
      # A tag signs these exact bytes without compiling them again.
      - name: Record the validated unsigned release
        if: github.event_name != 'pull_request'
        run: node scripts/android-build.mjs record android/app/build/outputs/apk/release
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: validated-android-release
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/output-metadata.json
            android/app/build/outputs/apk/release/validation.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  publish:
    needs: [resolve, check, device-extra, release]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || (needs.check.result == 'success' && needs.device-extra.result == 'success' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-stable-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: validated-android-release
          path: validated-apk
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run-id || github.run_id }}
      - name: Verify the exact commit, version and APK before signing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VALIDATED_RUN_ID: ${{ needs.resolve.outputs.run-id || github.run_id }}
        run: node scripts/android-build.mjs verify validated-apk
      - name: Prevent rollback of the stable update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { androidVersion } from './scripts/android-release.mjs';
          const releases = JSON.parse(execFileSync('gh', ['api', 'repos/leo91000/leo-agent-manager/releases?per_page=100']));
          const code = androidVersion(process.env.RELEASE_TAG).versionCode;
          for (const release of releases.filter(r => !r.draft && !r.prerelease)) {
            if (release.assets.some(a => a.name === 'android-update.json') && androidVersion(release.tag_name).versionCode >= code)
              throw new Error('An equal or newer Android release has already been published');
          }
          JS
      - name: Sign the validated APK without rebuilding
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LEO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$LEO_ANDROID_STORE_PASSWORD"
          export LEO_ANDROID_KEYSTORE="$RUNNER_TEMP/leo-android.p12"
          trap 'rm -f "$LEO_ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$LEO_ANDROID_KEYSTORE"
          mkdir -p distribution
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 validated-apk/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$LEO_ANDROID_KEYSTORE" --ks-key-alias leo-android \
            --ks-pass env:LEO_ANDROID_STORE_PASSWORD --key-pass env:LEO_ANDROID_STORE_PASSWORD \
            --out distribution/leo-android.apk validated-apk/app-release-unsigned.apk
      - name: Verify APK and prepare update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/leo-android.apk
          node scripts/android-release.mjs "$RELEASE_TAG" distribution/leo-android.apk validated-apk/output-metadata.json distribution/android-update.json
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only resume our draft; never replace an already published APK.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync(process.argv[1])).isDraft) process.exit(1)' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Leo $RELEASE_TAG" --notes 'La version Android est disponible ci-dessous. Les applications compatibles détectent automatiquement cette mise à jour. Android peut demander une confirmation pour installer le fichier APK.'
          fi
          gh release upload "$RELEASE_TAG" distribution/leo-android.apk distribution/android-update.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
