name: Android
on:
  pull_request:
    paths: ['apps/android/**', '.github/actions/setup-pnpm/**', '.github/actions/setup-android-emulator/**', .github/workflows/android.yaml, 'scripts/android-*.mjs', scripts/resolve-android-release.mjs, 'scripts/tests/android-*.test.mjs', tests/android-runner-smoke.mjs, tests/runner-storage-smoke.mjs]
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/android/**', '.github/actions/setup-pnpm/**', '.github/actions/setup-android-emulator/**', .github/workflows/android.yaml, 'scripts/android-*.mjs', scripts/resolve-android-release.mjs, 'scripts/tests/android-*.test.mjs', tests/android-runner-smoke.mjs, tests/runner-storage-smoke.mjs]
  workflow_dispatch:
env:
  CAIRN_BEACON_ORIGIN: ${{ vars.CAIRN_BEACON_ORIGIN }}
  CAIRN_ANDROID_FIREBASE_APP_ID: ${{ vars.CAIRN_ANDROID_FIREBASE_APP_ID }}
  CAIRN_ANDROID_FIREBASE_PROJECT_ID: ${{ vars.CAIRN_ANDROID_FIREBASE_PROJECT_ID }}
  CAIRN_ANDROID_FIREBASE_API_KEY: ${{ vars.CAIRN_ANDROID_FIREBASE_API_KEY }}
  CAIRN_ANDROID_FIREBASE_SENDER_ID: ${{ vars.CAIRN_ANDROID_FIREBASE_SENDER_ID }}
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run-id: ${{ steps.resolve.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-android-release.mjs
  check:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check Kotlin formatting
        working-directory: apps/android
        run: ./gradlew spotlessCheck --no-daemon
      - name: Unit tests and lint
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cairn-android
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.*
          retention-days: 14

  # Device jobs install these APKs instead of compiling the app again.
  build:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Use the tag version for a fresh release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf 'CAIRN_ANDROID_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build debug and instrumentation APKs
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cairn-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  # Pull requests skip @RobolectricTwin classes, whose journeys already run in
  # testDebugUnitTest; main, tags and manual runs execute every device test.
  # Shards are balanced with apps/android/device-test-timings.json.
  device:
    name: device (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [resolve, build]
    if: needs.resolve.outputs.reuse != 'true'
    # Set CAIRN_ANDROID_DEVICE_RUNNER to a larger runner label to move device tests
    # off the free runners; fork pull requests always stay on ubuntu-latest.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CAIRN_ANDROID_DEVICE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cairn-android-debug
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-android-emulator
        with:
          target: google_atd
          build-packages: ''
      - name: Run device tests on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          SKIP_ON_PULL_REQUEST: ${{ github.event_name == 'pull_request' && 'build.cairn.app.ui.RobolectricTwin' || '' }}
        with:
          api-level: 36
          arch: x86_64
          target: google_atd
          profile: pixel_6
          disable-animations: false
          script: node scripts/android-device-tests.mjs run --apk apks/debug/app-debug.apk --test-apk apks/androidTest/debug/app-debug-androidTest.apk --output device-results/shard-${{ matrix.shard }} --shard ${{ matrix.shard }}/${{ strategy.job-total }} --timings apps/android/device-test-timings.json --not-class build.cairn.app.data.DirectTransportDeviceTest ${SKIP_ON_PULL_REQUEST:+--not-annotation "$SKIP_ON_PULL_REQUEST"}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cairn-android-device-${{ matrix.shard }}
          path: device-results/
          retention-days: 14

  device-report:
    needs: [resolve, device]
    if: always() && !cancelled() && needs.resolve.outputs.reuse != 'true' && needs.device.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cairn-android-device-*
          path: device-results
      - name: Combine shard results and check captures
        env:
          CAPTURES: ${{ github.event_name == 'pull_request' && 'scroll-validation/pinned-stream.png' || 'scroll-validation/pinned-stream.png,model-picker/reasoning.png,conversation-lifecycle/swipe-fil.png,node-screenshots/nodes.png,node-screenshots/storage.png,node-screenshots/execution-sheet.png' }}
        run: node scripts/android-device-tests.mjs report device-results --require "$CAPTURES" --write-timings device-test-timings.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cairn-android-device-timings
          path: device-test-timings.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Use the tag version for a fresh release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf 'CAIRN_ANDROID_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build optimized release
        working-directory: apps/android
        run: ./gradlew assembleRelease --no-daemon
      # The workflow only succeeds when this build and the device checks pass.
      # A tag signs these exact bytes without compiling them again.
      - name: Record the validated unsigned release
        if: github.event_name != 'pull_request'
        run: node scripts/android-build.mjs record apps/android/app/build/outputs/apk/release
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: validated-android-release
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/apk/release/output-metadata.json
            apps/android/app/build/outputs/apk/release/validation.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  publish:
    needs: [resolve, check, device, device-report, release]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || (needs.check.result == 'success' && needs.device.result == 'success' && needs.device-report.result == 'success' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-stable-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: validated-android-release
          path: validated-apk
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run-id || github.run_id }}
      - name: Verify the exact commit, version and APK before signing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VALIDATED_RUN_ID: ${{ needs.resolve.outputs.run-id || github.run_id }}
        run: node scripts/android-build.mjs verify validated-apk
      - name: Prevent rollback of the stable update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { androidVersion } from './scripts/android-release.mjs';
          const releases = JSON.parse(execFileSync('gh', ['api', 'repos/leo91000/cairn/releases?per_page=100']));
          const code = androidVersion(process.env.RELEASE_TAG).versionCode;
          for (const release of releases.filter(r => !r.draft && !r.prerelease)) {
            if (release.assets.some(a => a.name === 'android-update.json') && androidVersion(release.tag_name).versionCode >= code)
              throw new Error('An equal or newer Android release has already been published');
          }
          JS
      - name: Sign the validated APK without rebuilding
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CAIRN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$CAIRN_ANDROID_STORE_PASSWORD"
          export CAIRN_ANDROID_KEYSTORE="$RUNNER_TEMP/cairn-android.p12"
          trap 'rm -f "$CAIRN_ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CAIRN_ANDROID_KEYSTORE"
          mkdir -p distribution
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 validated-apk/app-release-unsigned.apk
          # The release keystore holds exactly one key; apksigner selects it without an alias.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$CAIRN_ANDROID_KEYSTORE" \
            --ks-pass env:CAIRN_ANDROID_STORE_PASSWORD --key-pass env:CAIRN_ANDROID_STORE_PASSWORD \
            --out distribution/cairn-android.apk validated-apk/app-release-unsigned.apk
      - name: Verify APK and prepare update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/cairn-android.apk
          node scripts/android-release.mjs "$RELEASE_TAG" distribution/cairn-android.apk validated-apk/output-metadata.json distribution/android-update.json
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only resume our draft; never replace an already published APK.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync(process.argv[1])).isDraft) process.exit(1)' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Cairn $RELEASE_TAG" --notes 'La version Android est disponible ci-dessous. Les applications compatibles détectent automatiquement cette mise à jour. Android peut demander une confirmation pour installer le fichier APK.'
          fi
          gh release upload "$RELEASE_TAG" distribution/cairn-android.apk distribution/android-update.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
