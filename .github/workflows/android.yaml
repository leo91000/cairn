name: Blocked mission immutable observation
on:
  push:
    branches: [ci/blocked-mission-observer]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [32e148e3c04d09f73535e2330be480e6d7d0ca03]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.source }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify immutable source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T %cI'
          sha256sum apps/android/app/src/test/java/build/cairn/app/ui/BlockedMissionJourneyTest.kt apps/android/app/src/main/java/build/cairn/app/ui/FilScreen.kt
      - name: Apply repository Android formatter without a source diff
        run: |
          pnpm format:android
          git diff --exit-code
      - name: Qualify full Android on exact committed head
        run: pnpm validate:pr android
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: blocked-mission-full-${{ matrix.source }}
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Qualify complete blocked mission fixture explicitly
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --tests '*BlockedMissionJourneyTest*' --no-daemon
      - name: Verify final source
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code
          git status --porcelain
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: blocked-mission-targeted-${{ matrix.source }}
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
