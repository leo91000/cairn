name: Blocked mission immutable observation
on:
  push:
    branches: [ci/blocked-mission-observer]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [0417288da8d52b92a4275aa2429b1b7a6e33f409, 1774148251ddf632218b60afb340f51c2e0ba7ad]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.source }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify immutable source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T %cI'
          sha256sum apps/android/app/src/test/java/build/cairn/app/ui/BlockedMissionJourneyTest.kt apps/android/app/src/main/java/build/cairn/app/ui/FilScreen.kt
      - uses: actions/checkout@v7.0.1
        with:
          ref: ci/blocked-mission-observer
          path: observer
      - name: Instrument only the diagnostic fixture
        run: python3 observer/.github/blocked-mission-probe.py
      - name: Repeat the archive journey with named waits
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --tests '*BlockedMissionJourneyTest.archiving*' --no-daemon
      - name: Record diagnostic source patch
        if: always()
        run: git diff -- apps/android/app/src/test/java/build/cairn/app/ui/BlockedMissionJourneyTest.kt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: blocked-mission-${{ matrix.source }}
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.*
          retention-days: 14
