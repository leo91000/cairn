name: Android handoff diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: pnpm validate:pr android
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: handoff-android-diagnostic
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.*
          retention-days: 7
