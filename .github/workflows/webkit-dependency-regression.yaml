name: Synthetic real-caller physical lifecycle ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Additional synthetic physical lifecycle (NOT app Direct qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    env:
      PRODUCT_SHA: 523fdd9f76b0d82f4fae59ec12a4154954a85b72
      RUNTIME_SHA: b1863f5601e483000d96eaab121ce3ec0ae44c7b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        with:
          ref: 523fdd9f76b0d82f4fae59ec12a4154954a85b72
      - name: Bind source and require frozen runtime before any workload
        timeout-minutes: 5
        env:
          OBSERVER_SHA: ${{ github.sha }}
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 --no-tags origin "$RUNTIME_SHA"
          export C40_EVIDENCE_DIR="$RUNNER_TEMP/cairn-synthetic-physical-lifecycle"
          echo "C40_EVIDENCE_DIR=$C40_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$C40_EVIDENCE_DIR"
          python3 - <<'PYCODE'
          import os, subprocess, pathlib, json
          root=pathlib.Path.cwd(); evidence=pathlib.Path(os.environ['C40_EVIDENCE_DIR'])
          def git(*args): return subprocess.check_output(['git','-c','safe.directory='+str(root),*args]).decode().strip()
          expected={
              'playwright.config.ts',
              'tests/e2e/availability-lifecycle-fixture.ts',
              'tests/e2e/availability-lifecycle-fixture.node.mjs',
              'tests/e2e/availability-lifecycle.spec.ts',
              'docs/agents/availability-lifecycle-fixture.md',
          }
          changed=set(git('diff','--name-only',os.environ['RUNTIME_SHA'],os.environ['PRODUCT_SHA']).splitlines())
          assert changed==expected
          assert not git('diff',os.environ['RUNTIME_SHA'],os.environ['PRODUCT_SHA'],'--','apps/web/src','tests/e2e/availability-bfcache.spec.ts')
          (evidence/'source-binding.json').write_text(json.dumps({
              'product':os.environ['PRODUCT_SHA'],'tree':git('rev-parse','HEAD^{tree}'),
              'runtime':os.environ['RUNTIME_SHA'],'observer':os.environ['OBSERVER_SHA'],
              'runtimeBlobsUnchanged':True,'originalAppTestUnchanged':True,
              'appDirectQualified':False,'nativeGenerationPublicationCorrelation':False,
          }))
          PYCODE
      - uses: ./.github/actions/setup-pnpm
        timeout-minutes: 5
        with:
          cache: true
      - name: Require exact preinstalled SDK and image
        timeout-minutes: 5
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          assert.equal(JSON.parse(readFileSync('node_modules/@playwright/test/package.json','utf8')).version,'1.64.1')
          assert.equal(JSON.parse(readFileSync('/ms-playwright/.docker-info','utf8')).driverVersion,'1.64.1')
          JS
      - name: Real HTTP and closure controller light checks (NOT native)
        timeout-minutes: 5
        run: node --test tests/e2e/availability-lifecycle-fixture.node.mjs
      - name: Recollect exactly the two existing engine projects before build
        timeout-minutes: 5
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$C40_EVIDENCE_DIR/collection.json" ./node_modules/.bin/playwright test --config=playwright.config.ts --project=journeys-mcps --project=layout-webkit-mcps tests/e2e/availability-lifecycle.spec.ts --list --reporter=list,json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const report=JSON.parse(readFileSync(process.env.C40_EVIDENCE_DIR+'/collection.json','utf8'))
          const cases=[]
          function collect(suite) {
            for (const spec of suite.specs||[]) {
              for (const test of spec.tests) {
                assert.equal(test.results.length,0)
                cases.push([test.projectName,spec.title])
              }
            }
            for (const child of suite.suites||[]) collect(child)
          }
          for (const suite of report.suites) collect(suite)
          const title='restores the real availability caller in an eligible synthetic lifecycle fixture'
          assert.deepEqual(report.errors,[])
          assert.deepEqual(cases,[['journeys-mcps',title],['layout-webkit-mcps',title]])
          writeFileSync(process.env.C40_EVIDENCE_DIR+'/collection-receipt.json',JSON.stringify({collectionOnly:true,cases,appDirectQualified:false}))
          JS
      - name: Build unchanged runtime entry for the isolated fixture only
        timeout-minutes: 5
        run: VITE_CAIRN_TEST_RESUME_DIAGNOSTICS=true pnpm exec vite build --config apps/web/vite.config.ts
      - name: Physical lifecycle in the synthetic fixture only
        timeout-minutes: 5
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/synthetic-physical-lifecycle
        run: pnpm test:e2e --config=playwright.config.ts --project=journeys-mcps --project=layout-webkit-mcps tests/e2e/availability-lifecycle.spec.ts --workers=1 --retries=0 --fail-on-flaky-tests --trace=on --output=test-results/synthetic-physical-lifecycle
      - name: Always require exact final source identity
        timeout-minutes: 5
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cairn-synthetic-physical-lifecycle"
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='product=%H tree=%T' > "$RUNNER_TEMP/cairn-synthetic-physical-lifecycle/final-identity.txt"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        if: always()
        with:
          name: private-additional-synthetic-physical-lifecycle
          path: |
            ${{ runner.temp }}/cairn-synthetic-physical-lifecycle/
            test-results/synthetic-physical-lifecycle/
            playwright-report/synthetic-physical-lifecycle/
          retention-days: 14
