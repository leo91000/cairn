name: B534 native navigation paired diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: B534 native navigation (${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: base-7028fbfd
            sha: 7028fbfdd6d13e27b8f4e7db767899828d631b42
          - label: B-5d1645ea
            sha: 5d1645ea808cb18f7b64aa0dcd92987cc3ceeb2d
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - name: Record immutable diagnostic source
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          actual="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='commit=%H tree=%T'
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Check browser image version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          const preinstalled = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
          if (installed !== preinstalled)
            throw new Error(`Update the pinned browser image: Playwright package ${installed}, image ${preinstalled}`)
          JS
      - name: Collect the exact B534 controls before native compilation
        timeout-minutes: 3
        env:
          OBSERVER_SHA: ${{ github.sha }}
        run: |
          test ! -e target/debug/cairn
          test ! -e target/debug/examples/browser_fixture
          git -c safe.directory="$GITHUB_WORKSPACE" fetch origin "$OBSERVER_SHA"
          evidence_dir="$PWD/test-results/b534-collection"
          mkdir -p "$evidence_dir"
          original="$evidence_dir/mcps.original"
          cp tests/e2e/mcps.spec.ts "$original"
          trap 'cp "$original" tests/e2e/mcps.spec.ts' EXIT
          git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/diagnostics/b534-navigation-probe.ts" >> tests/e2e/mcps.spec.ts
          for control in native-cancel abort-before-goto; do
            for selection in fixed old; do
              expression='B534 native Agents navigation'
              if [ "$selection" = old ]; then expression='^B534 native Agents navigation'; fi
              set +e
              CAIRN_B534_CONTROL="$control" PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$control" PLAYWRIGHT_JSON_OUTPUT_FILE="$evidence_dir/$control-$selection.json" pnpm test:e2e mcps.spec.ts --config=playwright.config.ts --project=layout-webkit-mcps --grep "$expression" --workers=2 --retries=0 --fail-on-flaky-tests --trace=on --output="test-results/$control" --list --reporter=json > "$evidence_dir/$control-$selection.stdout" 2> "$evidence_dir/$control-$selection.stderr"
              code=$?
              set -e
              printf '%s\n' "$code" > "$evidence_dir/$control-$selection.exit"
            done
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'
          const root = 'test-results/b534-collection'
          const records = (report) => {
            const found = []
            const walk = (suites) => {
              for (const suite of suites || []) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    assert.equal(test.results?.length || 0, 0, 'Collection must not execute test fixtures')
                    found.push({ title: spec.title, project: test.projectName })
                  }
                }
                walk(suite.suites)
              }
            }
            walk(report.suites)
            return found
          }
          const controls = []
          for (const control of ['native-cancel', 'abort-before-goto']) {
            const prefix = `${root}/${control}`
            const fixedExit = Number(readFileSync(`${prefix}-fixed.exit`, 'utf8'))
            const fixed = JSON.parse(readFileSync(`${prefix}-fixed.json`, 'utf8'))
            const selected = records(fixed)
            assert.equal(fixedExit, 0)
            assert.equal(fixed.errors?.length || 0, 0)
            assert.deepEqual(selected, [{ title: `B534 native Agents navigation (${control})`, project: 'layout-webkit-mcps' }])
            const oldExit = Number(readFileSync(`${prefix}-old.exit`, 'utf8'))
            const old = existsSync(`${prefix}-old.json`) ? JSON.parse(readFileSync(`${prefix}-old.json`, 'utf8')) : undefined
            const oldSelected = old ? records(old) : []
            const diagnostic = readFileSync(`${prefix}-old.stdout`, 'utf8') + readFileSync(`${prefix}-old.stderr`, 'utf8') + JSON.stringify(old?.errors || [])
            assert.equal(oldExit, 1, 'Preserve the actual NoTests failure from the old grep')
            assert.equal(oldSelected.length, 0)
            assert.ok(diagnostic.includes('No tests found'), 'A loader/configuration error is not the old NoTests control')
            controls.push({ control, fixedExit, selected, oldExit, oldCount: oldSelected.length, oldNoTests: true })
          }
          assert.equal(controls.flatMap(control => control.selected).length, 2)
          const version = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          assert.equal(version, '1.64.1')
          writeFileSync(`${root}/receipt.json`, JSON.stringify({ collectionOnly: true, version, config: 'playwright.config.ts', controls }, null, 2))
          console.log('Pinned real CLI collection: old grep NoTests=1/0 cases; fixed grep exactly two named controls; no fixtures executed')
          JS
          cp "$original" tests/e2e/mcps.spec.ts
          cmp "$original" tests/e2e/mcps.spec.ts
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- tests/e2e/mcps.spec.ts
          trap - EXIT
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: b534-collection-${{ matrix.label }}
          path: test-results/b534-collection/
          retention-days: 14
      - name: Install the pinned Rust toolchain and build dependencies
        run: |
          node scripts/prepare-browser-build-dependencies.mjs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the manager fixtures and web assets
        run: |
          cargo build --locked --bin cairn --example worker_fixture --example browser_fixture --example network_direct_client --example network_qualification --example native_storage_qualifier
          cargo build --locked -p cairn-beacon --bin cairn-beacon --example network_stun_server --example beacon_sql_fixture
          pnpm exec vite build --config apps/web/vite.config.ts
      - name: Qualify the isolated Postgres fixture
        run: pnpm exec tsx scripts/qualify-beacon-sql-fixture.ts
      - name: Install observer-only B534 navigation probe
        env:
          OBSERVER_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ matrix.sha }}
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD:tests/e2e/mcps.spec.ts
          git -c safe.directory="$GITHUB_WORKSPACE" cat-file -e "$OBSERVER_SHA^{commit}"
          git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/diagnostics/b534-navigation-probe.ts" >> tests/e2e/mcps.spec.ts
      - name: Observe both single-variable native navigation controls
        timeout-minutes: 5
        run: |
          result=0
          for control in native-cancel abort-before-goto; do
            set +e
            CAIRN_B534_CONTROL="$control" PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$control" pnpm test:e2e mcps.spec.ts --config=playwright.config.ts --project=layout-webkit-mcps --grep 'B534 native Agents navigation' --workers=2 --retries=0 --fail-on-flaky-tests --trace=on --output="test-results/$control"
            code=$?
            set -e
            printf '%s exit=%s\n' "$control" "$code" >> b534-control-results.txt
            if [ "$code" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: b534-navigation-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
            b534-control-results.txt
          retention-days: 14
