name: Availability gate retirement diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    name: WebKit next read after gate retirement (NOT product qualification)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sha: b169440a3ccc0b21ddfccbc50b8aca6025cade06
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ matrix.sha }}
      - name: Record frozen product source and acquire only this observer's script
        timeout-minutes: 5
        env:
          OBSERVER_SHA: ${{ github.sha }}
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = b169440a3ccc0b21ddfccbc50b8aca6025cade06
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='source=%H tree=%T'
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 --no-tags origin "$OBSERVER_SHA"
          mkdir -p test-results/reader-native
          git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/diagnostics/availability-reader-native.mjs" > test-results/reader-native/run.mjs
          sha256sum test-results/reader-native/run.mjs tests/e2e/native-response-gate.ts tests/e2e/availability-probe.ts apps/web/src/availability-read.ts apps/web/src/BeaconApp.vue > test-results/reader-native/sources.sha256
          printf 'observer=%s\nproduct=b169440a3ccc0b21ddfccbc50b8aca6025cade06\nmode=webkit-next-read-after-initial-gate-retirement\n' "$OBSERVER_SHA" > test-results/reader-native/source.txt
      - uses: ./.github/actions/setup-pnpm
        timeout-minutes: 5
        with:
          cache: true
      - name: Require the exact preinstalled browser version
        timeout-minutes: 5
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
          assert.equal(installed, '1.64.1')
          assert.equal(image, installed)
          JS
      - name: Observe only the next real WebKit read in the two gate states
        timeout-minutes: 5
        run: node test-results/reader-native/run.mjs
      - name: Require unchanged product and diagnostic bytes
        timeout-minutes: 5
        if: always()
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = b169440a3ccc0b21ddfccbc50b8aca6025cade06
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          sha256sum --check test-results/reader-native/sources.sha256
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        if: always()
        with:
          name: native-reader-mechanism-private
          path: test-results/reader-native/
          retention-days: 14
