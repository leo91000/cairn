name: Direct owner first receipt ONLY (NOT repair qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-owner:
    name: ONE WebKit scoped-outage owner receipt ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    env:
      PRODUCT_SHA: e7c3801796611a26956f22fe2f3311ad1a2130ff
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        with:
          ref: e7c3801796611a26956f22fe2f3311ad1a2130ff
      - name: Bind immutable product and versioned TEST ONLY observer bytes
        timeout-minutes: 5
        env:
          OBSERVER_SHA: ${{ github.sha }}
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 --no-tags origin "$OBSERVER_SHA"
          export C40_EVIDENCE_DIR="$RUNNER_TEMP/cairn-direct-owner-first-receipt"
          echo "C40_EVIDENCE_DIR=$C40_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$C40_EVIDENCE_DIR" test-results/direct-owner-receipt
          for file in archive-transparency.node.mjs availability-reader-native.mjs skill-availability-probe.ts b534-navigation-probe.ts direct-owner-probe.mjs direct-owner-probe.d.mts direct-owner-probe.node.mjs direct-owner-overlay-control.mjs closed-target-error.mjs mcps.direct-owner.overlay.ts direct-transport.seam.overlay.ts overlay-manifest.json; do
            git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/diagnostics/$file" > "test-results/direct-owner-receipt/$file"
          done
          git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/workflows/webkit-dependency-regression.yaml" > test-results/direct-owner-receipt/selected-workflow.yaml
          sha256sum test-results/direct-owner-receipt/* > "$C40_EVIDENCE_DIR/observer-source.sha256"
          node test-results/direct-owner-receipt/direct-owner-overlay-control.mjs bind
      - uses: ./.github/actions/setup-pnpm
        timeout-minutes: 5
        with:
          cache: true
      - name: Require SAME pinned SDK and preinstalled image
        timeout-minutes: 5
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          assert.equal(JSON.parse(readFileSync('node_modules/@playwright/test/package.json','utf8')).version,'1.64.1')
          assert.equal(JSON.parse(readFileSync('/ms-playwright/.docker-info','utf8')).driverVersion,'1.64.1')
          JS
      - name: Light actual recorder projection overlay and cleanup checks (NOT browser)
        timeout-minutes: 5
        run: |
          node --test test-results/direct-owner-receipt/direct-owner-probe.node.mjs
          node test-results/direct-owner-receipt/archive-transparency.node.mjs --product-reference --source-trusted-limit
      - name: Apply ONLY two exact hash-pinned TEST overlays
        timeout-minutes: 5
        run: node test-results/direct-owner-receipt/direct-owner-overlay-control.mjs apply
      - name: Real existing module and probe source suites (native cause unproven)
        timeout-minutes: 5
        run: |
          pnpm exec vitest run apps/web/tests/direct-transport.test.ts apps/web/tests/availability-read.test.ts --maxWorkers=1
          printf 'source-product=e7c3801796611a26956f22fe2f3311ad1a2130ff\nsource-only=true\nnative-cause-established=false\n' > "$C40_EVIDENCE_DIR/source-seam-meaning.txt"
      - name: Restore the original source unit test before any browser build
        timeout-minutes: 5
        if: always()
        run: node test-results/direct-owner-receipt/direct-owner-overlay-control.mjs restore-unit
      - name: Recollect EXACT ONE WebKit scoped-outage case before Cargo
        timeout-minutes: 5
        run: |
          test ! -e target/debug/cairn
          PLAYWRIGHT_JSON_OUTPUT_FILE="$C40_EVIDENCE_DIR/collection.json" ./node_modules/.bin/playwright test --config=playwright.config.ts --project=layout-webkit-mcps tests/e2e/mcps.spec.ts --grep 'availability preserves a scoped readonly outage before native navigation' --list --reporter=list,json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const report=JSON.parse(readFileSync(process.env.C40_EVIDENCE_DIR+'/collection.json','utf8'))
          const cases=[]
          function collect(suite) {
            for (const spec of suite.specs||[]) {
              for (const test of spec.tests) {
                assert.equal(test.results.length,0)
                cases.push([test.projectName,spec.file,spec.title])
              }
            }
            for (const child of suite.suites||[]) collect(child)
          }
          for (const suite of report.suites) collect(suite)
          assert.deepEqual(report.errors,[])
          assert.deepEqual(cases,[['layout-webkit-mcps','mcps.spec.ts','availability preserves a scoped readonly outage before native navigation']])
          writeFileSync(process.env.C40_EVIDENCE_DIR+'/collection-receipt.json',JSON.stringify({collectionOnly:true,cases,productQualified:false}))
          JS
      - name: Install same disposable native fixture build dependencies
        timeout-minutes: 5
        run: |
          node scripts/prepare-browser-build-dependencies.mjs
          timeout --signal=TERM --kill-after=5s 60s apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=20 install -y --no-install-recommends zip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build only manager fixtures needed by the original case
        timeout-minutes: 5
        run: cargo build --locked --bin cairn --example worker_fixture --example browser_fixture
      - name: Build only Beacon and SQL fixtures needed by the original case
        timeout-minutes: 5
        run: cargo build --locked -p cairn-beacon --bin cairn-beacon --example beacon_sql_fixture
      - name: Build unchanged PR browser configuration
        timeout-minutes: 5
        run: VITE_CAIRN_TEST_RESUME_DIAGNOSTICS=true pnpm exec vite build --config apps/web/vite.config.ts
      - name: Qualify same isolated Postgres fixture
        timeout-minutes: 5
        run: pnpm exec tsx scripts/qualify-beacon-sql-fixture.ts
      - name: Require all product bytes except the ONE test overlay unchanged
        timeout-minutes: 5
        run: |
          sha256sum --check "$C40_EVIDENCE_DIR/observer-source.sha256"
          node test-results/direct-owner-receipt/direct-owner-overlay-control.mjs check
      - name: ONE WebKit original scoped-outage diagnostic ONLY
        timeout-minutes: 5
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/direct-owner-first-receipt
        run: pnpm test:e2e tests/e2e/mcps.spec.ts --project=layout-webkit-mcps --grep 'availability preserves a scoped readonly outage before native navigation' --workers=1 --retries=0 --fail-on-flaky-tests --trace=on --output=test-results/direct-owner-first-receipt
      - name: ALWAYS restore exact original tests and product identity
        timeout-minutes: 5
        if: always()
        run: |
          export C40_EVIDENCE_DIR="${C40_EVIDENCE_DIR:-$RUNNER_TEMP/cairn-direct-owner-first-receipt}"
          mkdir -p "$C40_EVIDENCE_DIR"
          node test-results/direct-owner-receipt/direct-owner-overlay-control.mjs restore
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
          sha256sum --check "$C40_EVIDENCE_DIR/observer-source.sha256"
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='product=%H tree=%T' > "$C40_EVIDENCE_DIR/final-identity.txt"
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        if: always()
        with:
          name: private-direct-owner-first-receipt
          path: |
            ${{ runner.temp }}/cairn-direct-owner-first-receipt/
            test-results/direct-owner-first-receipt/
            playwright-report/direct-owner-first-receipt/
          retention-days: 14
