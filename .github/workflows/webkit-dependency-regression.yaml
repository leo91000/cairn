name: Skill availability paired diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: skill availability (${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: base-fbd0b96e
            sha: fbd0b96e7450948e5f8b7829bdff157733291413
          - label: candidate-59d80524
            sha: 59d805247c872688fa59f84c77d9ffd560d9399a
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - name: Record immutable diagnostic source
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          actual="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='commit=%H tree=%T'
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain)"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Check browser image version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          const preinstalled = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
          if (installed !== preinstalled)
            throw new Error(`Update the pinned browser image: Playwright package ${installed}, image ${preinstalled}`)
          JS
      - name: Install the pinned Rust toolchain and build dependencies
        run: |
          node scripts/prepare-browser-build-dependencies.mjs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the manager fixtures and web assets
        run: |
          cargo build --locked -p cairn-installation --bin cairn --example worker_fixture --example browser_fixture
          cargo build --locked -p cairn-beacon --bin cairn-beacon --example beacon_sql_fixture
          VITE_CAIRN_TEST_RESUME_DIAGNOSTICS=true pnpm exec vite build --config apps/web/vite.config.ts
      - name: Qualify the isolated Postgres fixture
        run: pnpm exec tsx scripts/qualify-beacon-sql-fixture.ts
      - name: Install observer-only real reload probes
        env:
          OBSERVER_SHA: ${{ github.sha }}
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" fetch origin "$OBSERVER_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" show "$OBSERVER_SHA:.github/diagnostics/skill-availability-probe.ts" >> tests/e2e/skill-bundles.spec.ts
      - name: Probe availability across actual reload boundaries
        timeout-minutes: 5
        run: pnpm test:e2e skill-bundles.spec.ts --project=layout-webkit-skill-bundles --grep 'availability native reload probe' --workers=1 --retries=0 --fail-on-flaky-tests --trace=on
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: skill-availability-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
