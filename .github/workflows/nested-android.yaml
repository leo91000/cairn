name: Nested Android probe
on:
  workflow_dispatch:
    inputs:
      image:
        description: Existing application image by immutable digest
        required: true
        type: string
      api:
        description: Android device API level
        required: true
        default: '34'
        type: string
      system:
        description: Android system image
        required: true
        default: google-apis
        type: choice
        options: [google-apis, aosp]
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare KVM host
        run: |
          test -c /dev/kvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Android inside the existing Firecracker image
        env:
          SMOKE_IMAGE: ${{ inputs.image }}
          ANDROID_TEST_API: ${{ inputs.api }}
          ANDROID_TEST_SYSTEM: ${{ inputs.system }}
          ANDROID_SCREENSHOTS: ${{ runner.temp }}/nested-android
        run: |
          [[ "$SMOKE_IMAGE" =~ ^ghcr.io/leo91000/cairn@sha256:[a-f0-9]{64}$ ]]
          node tests/android-runner-smoke.mjs "$SMOKE_IMAGE"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nested-android-evidence
          path: ${{ runner.temp }}/nested-android/
          if-no-files-found: ignore
          retention-days: 14
