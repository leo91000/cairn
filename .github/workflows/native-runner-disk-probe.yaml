name: Read-only Native runner disk inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inspect fixed filesystem and mount metadata without changing it
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import { spawnSync } from 'node:child_process'
          if (process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted' || process.platform !== 'linux' || os.userInfo().username !== 'runner')
            throw new Error('Only a disposable GitHub-hosted Linux runner may be inspected.')
          const locations = ['/', '/mnt', '/tmp', '/var/tmp', process.env.GITHUB_WORKSPACE, process.env.RUNNER_TEMP]
          const directories = locations.map(location => {
            try {
              const stat = fs.lstatSync(location)
              const filesystem = fs.statfsSync(location, { bigint: true })
              return { path: location, canonical: fs.realpathSync(location), device: stat.dev, uid: stat.uid, mode: stat.mode, symlink: stat.isSymbolicLink(), totalBytes: `${filesystem.blocks * filesystem.bsize}`, availableBytes: `${filesystem.bavail * filesystem.bsize}`, freeInodes: `${filesystem.ffree}` }
            } catch (error) { return { path: location, error: error.code } }
          })
          const commands = [['lsblk', ['--json', '--bytes', '--output', 'NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS']], ['findmnt', ['--json', '--output', 'SOURCE,TARGET,FSTYPE,OPTIONS']], ['du', ['-x', '-B1', '--max-depth=1', '--', '/mnt']]]
          const inventory = { imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion, cpu: os.cpus()[0]?.model, cpus: os.cpus().length, memoryBytes: os.totalmem(), directories, commands: commands.map(([command, args]) => { const result = spawnSync(command, args, { encoding: 'utf8', timeout: 10000, maxBuffer: 1024 * 1024 }); return { command, args, status: result.status, error: result.error?.code, stdout: result.stdout, stderr: result.stderr } }) }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'native-runner-disk-inventory.json'), JSON.stringify(inventory, null, 2) + '\n', { flag: 'wx' })
          console.log(JSON.stringify({ imageVersion: inventory.imageVersion, directories }))
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-runner-disk-inventory
          path: ${{ runner.temp }}/native-runner-disk-inventory.json
          if-no-files-found: error
          retention-days: 7
