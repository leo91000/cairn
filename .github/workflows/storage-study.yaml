name: Storage study tools
on:
  pull_request:
    paths:
      - .github/workflows/storage-study.yaml
      - deploy/installations/storage-observer.*
      - scripts/install-storage-observer.sh
      - scripts/benchmark-storage-formats.py
      - scripts/sample-storage-cache.py
      - scripts/prepare-storage-sample.py
      - scripts/tests/storage_formats_test.py
      - scripts/tests/storage_sample_test.py
      - scripts/tests/storage_observer_test.py
  push:
    branches: [main]
    paths:
      - .github/workflows/storage-study.yaml
      - deploy/installations/storage-observer.*
      - scripts/install-storage-observer.sh
      - scripts/benchmark-storage-formats.py
      - scripts/sample-storage-cache.py
      - scripts/prepare-storage-sample.py
      - scripts/tests/storage_formats_test.py
      - scripts/tests/storage_sample_test.py
      - scripts/tests/storage_observer_test.py
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated experiment dependencies
        run: python -m pip install cryptography==46.0.3 fastcdc==1.7.0 zstandard==0.25.0 blake3==1.0.8 ruff==0.16.6
      - name: Check Python tools and operator units
        run: |
          files=(deploy/installations/storage-observer.py scripts/benchmark-storage-formats.py scripts/sample-storage-cache.py scripts/prepare-storage-sample.py scripts/tests/storage_formats_test.py scripts/tests/storage_sample_test.py scripts/tests/storage_observer_test.py)
          ruff check --select E4,E7,E9,F,I,EXE "${files[@]}"
          ruff format --check "${files[@]}"
          bash -n scripts/install-storage-observer.sh
          systemd-analyze verify deploy/installations/storage-observer.service deploy/installations/storage-observer.timer
      - name: Verify recovery, integrity, accounting and discard on private fixtures
        run: |
          python scripts/tests/storage_observer_test.py
          python scripts/tests/storage_formats_test.py
          python scripts/tests/storage_sample_test.py
