name: PR validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
      contracts: ${{ steps.scope.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          import { validationScope } from './scripts/pr-validation-scope.mjs'
          const args = !process.env.BASE || /^0+$/.test(process.env.BASE)
            ? ['ls-tree', '-r', '--name-only', '-z', process.env.HEAD]
            : ['diff', '--name-only', '-z', process.env.BASE, process.env.HEAD]
          const files = execFileSync('git', args, { encoding: 'utf8' }).split('\0')
          const { android, contracts } = validationScope(files)
          appendFileSync(process.env.GITHUB_OUTPUT, `android=${android}\ncontracts=${contracts}\n`)
          JS
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt && rustup default 1.97.1
      - run: pnpm validate:pr quality
  contracts:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm validate:pr contracts
  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: pnpm validate:pr android
  required:
    name: PR validation required
    needs: [scope, quality, contracts, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS)
          for (const name of ['scope', 'quality']) {
            if (jobs[name].result !== 'success')
              throw new Error(`${name} did not pass`)
          }
          for (const name of ['contracts', 'android']) {
            const expected = jobs.scope.outputs[name] === 'true' ? 'success' : 'skipped'
            if (jobs[name].result !== expected)
              throw new Error(`${name}: expected ${expected}, got ${jobs[name].result}`)
          }
          JS
