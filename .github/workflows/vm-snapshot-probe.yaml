name: VM snapshot source-pinned probe
on:
  push:
    branches: [fix/vm-active-snapshot-probe]
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline-bbc08430
            revision: bbc08430ac2e8ede9abcf5b04f6ceea4e4264b74
            image: ghcr.io/leo91000/cairn@sha256:abef117fe815689a705a9874a49980f8fa2f37e5dd08532228db982dfdd2aaae
          - source: pr572-92442d4b
            revision: 92442d4b0e266a1f12db9d13145e29589cbf73f7
            image: ghcr.io/leo91000/cairn@sha256:3f117abd79e5ea47068922d9277905eaa215e6cdd98de1c6c07bc9d3020152b6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare disposable KVM and ublk host
        run: |
          test -e /dev/kvm
          if ! sudo modprobe ublk_drv; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          test "$(cat /proc/sys/kernel/io_uring_disabled)" = 0
      - name: Confirm immutable source and run real VM qualification
        env:
          PROBE_IMAGE: ${{ matrix.image }}
          PROBE_REVISION: ${{ matrix.revision }}
          PROBE_SOURCE: ${{ matrix.source }}
          CAIRN_PROBE_INBOX_POLL_MS: '0'
        run: |
          docker pull "$PROBE_IMAGE"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PROBE_IMAGE")
          test "$revision" = "$PROBE_REVISION"
          printf 'Immutable source %s revision %s\n' "$PROBE_SOURCE" "$revision"
          node tests/runner-smoke.mjs "$PROBE_IMAGE"
