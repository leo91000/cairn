name: VM snapshot source-pinned probe
on:
  push:
    branches: [fix/vm-active-snapshot-probe]
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: main577-3c63a0e4
            revision: 3c63a0e4229de4b3b9dc2cfa27580fb59ef9184d
            image: ghcr.io/leo91000/cairn@sha256:c21f1c9f0eb0c2911fb8e7507030f3ef81f50d34b942752121caeb9dab4fd2a1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7e0dfb38675b92a7f7511d467d399169efe5277d
      - uses: ./.github/actions/setup-pnpm
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare disposable KVM and ublk host
        run: |
          test -e /dev/kvm
          if ! sudo modprobe ublk_drv; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          test "$(cat /proc/sys/kernel/io_uring_disabled)" = 0
      - name: Confirm immutable source and run real VM qualification
        env:
          PROBE_IMAGE: ${{ matrix.image }}
          PROBE_REVISION: ${{ matrix.revision }}
          PROBE_SOURCE: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = 7e0dfb38675b92a7f7511d467d399169efe5277d
          test -z "$(git status --porcelain)"
          pnpm exec vitest run scripts/tests/runner-probe.test.mjs
          docker pull "$PROBE_IMAGE"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PROBE_IMAGE")
          test "$revision" = "$PROBE_REVISION"
          printf 'Immutable source %s revision %s\n' "$PROBE_SOURCE" "$revision"
          node tests/runner-smoke.mjs "$PROBE_IMAGE"
