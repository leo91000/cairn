name: Direct timeout diagnostic
on:
  push:
    branches: [fix/release-direct-timeout]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-direct-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build the native client and instrumented tests
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-direct-apks
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
  android-direct:
    name: Android direct-relay device bench (${{ matrix.scenario }})
    needs: android-direct-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [same-lan]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: dist/
          run-id: 40979200245
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
          run-id: 40979200245
          github-token: ${{ github.token }}
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          path: apps/android/app/build/outputs/apk/
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-emulator
        with:
          build-packages: ''
      - name: Observe native responses, network restart and revocation
        env:
          ANDROID_SCENARIO: ${{ matrix.scenario }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            for repetition in 1 2 3; do
              python3 tests/network-bench.py "$ANDROID_SCENARIO" --android --output "test-results/android-direct/$ANDROID_SCENARIO-$repetition.json" || exit 1
            done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-direct-device-evidence-${{ matrix.scenario }}
          path: test-results/android-direct/
          retention-days: 14
