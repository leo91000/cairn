name: A7 isolated backend qualification
on:
  push:
    branches: ['qualification/a7-497-*']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@localhost:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Verify qualification source identity
        run: |
          test "$(git rev-parse HEAD^)" = "0804c7da8df3f7fd79d72c5d5a9e10a875184fa6"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/a7-backend-qualification.yaml"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev age e2fsprogs fakeroot
      - uses: ./.github/actions/cache-rust
      - name: Run the complete backend suite with isolated credentials
        run: |
          set -o pipefail
          pnpm test:backend --no-fail-fast -- --test-threads=1 2>&1 | tee backend-tests.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: a7-isolated-backend-evidence
          path: backend-tests.log
          retention-days: 7
