name: Plan draft isolated qualification
on:
  push:
    branches: [ci/plan-draft-observer]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: a6f4625d6baa1377fe9a2b6d6d9f92ca22011930
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Install pinned Rust and browser fixture dependencies
        run: |
          node scripts/prepare-browser-build-dependencies.mjs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build exact committed source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = a6f4625d6baa1377fe9a2b6d6d9f92ca22011930
          test -z "$(git status --porcelain)"
          git show -s --format='%H %cI %s'
          cargo build --locked -p cairn-installation --bin cairn --example worker_fixture --example browser_fixture
          cargo build --locked -p cairn-beacon --bin cairn-beacon --example beacon_sql_fixture
          pnpm build
          sha256sum target/debug/cairn target/debug/cairn-beacon target/debug/examples/browser_fixture
      - name: Qualify disposable Postgres fixture
        run: pnpm exec tsx scripts/qualify-beacon-sql-fixture.ts
      - name: Complete affected Chromium and WebKit journeys
        run: pnpm test:e2e claude.spec.ts chat-switch.spec.ts chats.spec.ts chat-attachments.spec.ts readable-slugs.spec.ts installation-subdomains.spec.ts --project='journeys*' --project='layout-webkit-*' --workers=2 --retries=0 --fail-on-flaky-tests --trace=on --output=evidence/affected
      - name: Repeat original regression without retries
        run: pnpm test:e2e claude.spec.ts --grep 'plan drafts keep their mode' --project=layout-webkit-claude --repeat-each=10 --workers=1 --retries=0 --fail-on-flaky-tests --trace=on --output=evidence/repeated
      - name: Verify final source identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = a6f4625d6baa1377fe9a2b6d6d9f92ca22011930
          git diff --exit-code
          git status --porcelain
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: plan-draft-exact-head-a6f4625d
          path: |
            evidence/
            playwright-report/
          retention-days: 14
