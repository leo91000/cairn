name: Android direct source comparison
on:
  workflow_dispatch:
    inputs:
      source-run:
        description: Existing native backend and web artifact run
        required: true
        type: string
        default: "40696410719"
      apk-run:
        description: Existing instrumented APK artifact run
        required: true
        type: string
        default: "40710472521"
permissions:
  contents: read
  actions: read
jobs:
  device:
    name: same-lan ${{ matrix.case }} replica ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - full
        replica:
          - 1
          - 2
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U cairn -d cairn_beacon_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run }}
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          path: apps/android/app/build/outputs/apk/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.apk-run }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-emulator
        with:
          build-packages: ""
      - name: Observe native responses, network restart and revocation
        env:
          ANDROID_SCENARIO: same-lan
          CAIRN_DIRECT_CASE: ${{ matrix.case }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: for attempt in 1 2 3; do python3 tests/network-bench.py same-lan --android --output "test-results/android-direct/${{ matrix.case }}-${{ matrix.replica }}-$attempt.json"; done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-direct-diagnostic-${{ matrix.case }}-${{ matrix.replica }}
          path: test-results/android-direct/
          retention-days: 14
