name: Native 571 close diagnostic (manual, disposable, no build)
# Diagnostic branch only. Never merge this replacement into the product branch.

on:
  workflow_dispatch:
    inputs:
      fixture_commit:
        description: Exact reviewed diagnostic commit; must equal this run SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  close-diagnostic:
    if: github.repository == 'leo91000/cairn' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/native-571-retirement-repro'
    runs-on: ubuntu-24.04
    # No compile: artifact verification, disposable dependency setup and six
    # existing 90-second terminal-evidence bounds fit within this job budget.
    timeout-minutes: 25
    env:
      CAIRN_NATIVE_DISPOSABLE_HOST: '1'
      CAIRN_NATIVE_CLOSE_REPRO: '1'
      NATIVE_STORAGE_EVIDENCE_DIR: ${{ github.workspace }}/native-close-evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact reviewed fixture and pinned source objects
        timeout-minutes: 3
        env:
          EXPECTED_FIXTURE: ${{ inputs.fixture_commit }}
        run: |
          test "$EXPECTED_FIXTURE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FIXTURE"
          python3 -B scripts/tests/native_close_provenance.py --sources-only --output native-close-evidence/sources
      - name: Fetch only the immutable verified reference artifact
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/tests/native_close_provenance.py --output native-close-evidence/runtime
      - name: Prepare disposable block storage and synthetic loopback S3
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs python3-venv sudo uidmap iproute2 iptables libcap2-bin
          sudo modprobe tun
          sudo modprobe ip_tables
          sudo modprobe iptable_nat
          sudo modprobe ip6_tables
          sudo modprobe ip6table_nat
          if ! sudo modprobe ublk_drv; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          python3 -m venv .native-s3-test
          .native-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
      - name: Run six real close controls with the pinned 93b runtime
        timeout-minutes: 10
        run: |
          sudo env PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 CAIRN_NATIVE_CLOSE_REPRO=1 PYTHONDONTWRITEBYTECODE=1 NATIVE_STORAGE_EVIDENCE_DIR="$NATIVE_STORAGE_EVIDENCE_DIR" .native-s3-test/bin/python scripts/tests/node_s3_test.py --native-runtime native-close-evidence/runtime/cairn --qualifier native-close-evidence/runtime/examples/native_storage_qualifier
      - name: Upload content-free diagnostic proof, never binaries or raw logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-571-close-diagnostic-${{ github.run_id }}
          path: |
            native-close-evidence/sources/provenance.json
            native-close-evidence/runtime/provenance.json
            native-close-evidence/runtime/revision.json
            native-close-evidence/native-close-repro.json
          if-no-files-found: warn
          retention-days: 14
