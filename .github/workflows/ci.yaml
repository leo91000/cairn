    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [same-lan, udp-blocked, network-change]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: dist/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          path: apps/android/app/build/outputs/apk/
      - uses: android-actions/setup-android@v3
