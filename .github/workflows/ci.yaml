# Disposable source-bound acquisition check. No build or release provenance.
name: Nextest acquisition qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nextest-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ef4fb97962a2d56533496772fdba64ee6e65feff
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bind the exact candidate source without compiling
        run: |
          test "$(git rev-parse HEAD)" = ef4fb97962a2d56533496772fdba64ee6e65feff
          test "$(git rev-parse 'HEAD^{tree}')" = 3892e2e9c5e0ac12641d44a3a78f8a2b334a20f2
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' | tee nextest-source.txt
          sha256sum scripts/install-nextest-ci.mjs | tee -a nextest-source.txt
      - name: Acquire and verify the fixed official asset exactly once
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node scripts/install-nextest-ci.mjs | tee nextest-acquisition.json
          cargo-nextest nextest --version
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nextest-acquisition
          path: |
            nextest-source.txt
            nextest-acquisition.json
          if-no-files-found: error
