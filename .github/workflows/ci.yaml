name: Composed Android artifact qualification
on:
  workflow_dispatch:
    inputs:
      backend_run:
        description: Immutable qualified backend artifact run
        type: string
        required: true
        default: "41047755908"
      backend_sha:
        description: Expected backend source SHA
        type: string
        required: true
        default: 92442d4b0e266a1f12db9d13145e29589cbf73f7
      android_run:
        description: Immutable repaired instrumentation APK run
        type: string
        required: true
        default: "41053729853"
      android_sha:
        description: Expected Android source SHA
        type: string
        required: true
        default: 95583beec3105c18b0e224915157986188329b58
permissions:
  contents: read
  actions: read
concurrency:
  group: android-composition-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  android-direct:
    name: Composed Android transport (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - same-lan
          - udp-blocked
          - network-change
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U cairn -d cairn_beacon_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify immutable component source revisions
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RUN: ${{ inputs.backend_run }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          ANDROID_RUN: ${{ inputs.android_run }}
          ANDROID_SHA: ${{ inputs.android_sha }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_RUN" =~ ^[0-9]+$ && "$ANDROID_RUN" =~ ^[0-9]+$ ]]
          [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ && "$ANDROID_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKEND_RUN" --jq .head_sha)" = "$BACKEND_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN" --jq .head_sha)" = "$ANDROID_SHA"
          mkdir -p test-results/android-direct
          python3 -c 'import json,os; print(json.dumps({k:os.environ[k] for k in ["BACKEND_RUN","BACKEND_SHA","ANDROID_RUN","ANDROID_SHA"]}))' > test-results/android-direct/components.json
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: dist/
          run-id: ${{ inputs.backend_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
          run-id: ${{ inputs.backend_run }}
          github-token: ${{ github.token }}
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          path: apps/android/app/build/outputs/apk/
          run-id: ${{ inputs.android_run }}
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-emulator
        with:
          build-packages: ""
      - name: Observe native responses, network restart and revocation
        env:
          ANDROID_SCENARIO: ${{ matrix.scenario }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            python3 tests/network-bench.py "$ANDROID_SCENARIO" --android --output "test-results/android-direct/$ANDROID_SCENARIO.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-direct-device-evidence-${{ matrix.scenario }}
          path: test-results/android-direct/
          retention-days: 14
