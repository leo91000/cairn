# DIAGNOSTIC BRANCH ONLY. NEVER MERGE THIS WORKFLOW REPLACEMENT.
name: Native shutdown controlled observation
on:
  workflow_dispatch:
    inputs:
      intent:
        description: Unique coordinator-approved intent
        required: true
        type: string
      reviewed-head:
        description: Frozen commit reviewed independently before dispatch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-shutdown-8379-controlled-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/test/native-systemd-shutdown' && inputs.intent == 'native-shutdown-8379-v1' && inputs.reviewed-head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pure evidence schema and frozen production sources
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_native_shutdown_observer.py -v
          python3 scripts/tests/native_shutdown_provenance.py
          git diff --exit-code
      - name: Prepare one explicitly disposable systemd host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev e2fsprogs python3-venv sudo uidmap iproute2 iptables libcap2-bin
          sudo modprobe tun
          sudo modprobe ip_tables
          sudo modprobe iptable_nat
          sudo modprobe ip6_tables
          sudo modprobe ip6table_nat
          if ! sudo modprobe ublk_drv; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          python3 -m venv .native-s3-test
          .native-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
      - name: Build exact reviewed source once in CI
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --locked --bin cairn --example native_storage_qualifier
      - name: Observe the unchanged normal controller lifecycle
        run: |
          mkdir -p native-shutdown-evidence
          sudo env PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 CAIRN_NATIVE_SHUTDOWN_MATRIX=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-shutdown-evidence" .native-s3-test/bin/python scripts/tests/node_s3_test.py --repo "$PWD" --native-runtime target/debug/cairn --qualifier target/debug/examples/native_storage_qualifier
      - name: Evaluate real captured results with the production manager guard
        env:
          CAIRN_NATIVE_SHUTDOWN_EVIDENCE: ${{ github.workspace }}/native-shutdown-evidence/native-shutdown-matrix.json
        run: node scripts/test-backend.mjs -p cairn-installation --lib worker::checkpoint::tests::classify_native_shutdown_matrix_with_production_guard -- --ignored --exact
      - name: Upload only fixed allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-shutdown-8379-${{ github.run_id }}
          path: |
            native-shutdown-evidence/native-shutdown-matrix.json
            native-shutdown-evidence/source-provenance.json
          if-no-files-found: warn
          retention-days: 7
