name: Quality and container
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-tail-graph-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  backend:
    name: Compile-only graph diagnostic (${{ matrix.scope }}) — no test qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        scope: [package, workspace]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@localhost:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve the immutable observer outside the source checkout
        run: |
          mkdir "$RUNNER_TEMP/backend-tail-observer"
          cp scripts/diagnostics/backend-tail-* "$RUNNER_TEMP/backend-tail-observer/"
      - name: Check out the exact common source for both graph selections
        uses: actions/checkout@v7.0.1
        with:
          ref: fbd0b96e7450948e5f8b7829bdff157733291413
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Install the unchanged native test dependencies
        timeout-minutes: 10
        run: node scripts/install-native-ci-dependencies.mjs
      - uses: ./.github/actions/prepare-rust-runner
        timeout-minutes: 3
      - name: Preserve capacity before compilation without matrix artifact collisions
        run: node scripts/ci-rust-build-observation.mjs before-build "$RUNNER_TEMP/backend-tail-capacity-before.json"
      - name: Install the unchanged pinned nextest binary
        timeout-minutes: 3
        run: node scripts/install-nextest-ci.mjs
      - name: Validate all generated flags with the actual pinned CLI before compilation
        run: CAIRN_BACKEND_SOURCE="$GITHUB_WORKSPACE" CAIRN_NEXTEST_CLI="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-nextest" python3 "$RUNNER_TEMP/backend-tail-observer/backend-tail-cli-regression.py"
      - name: Compare the test-library graph after the real workspace build
        env:
          GRAPH_SCOPE: ${{ matrix.scope }}
        run: bash "$RUNNER_TEMP/backend-tail-observer/backend-tail-graph.sh"
      - name: Preserve capacity after compilation without matrix artifact collisions
        if: always()
        run: node scripts/ci-rust-build-observation.mjs after-build "$RUNNER_TEMP/backend-tail-capacity-after.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: backend-tail-graph-${{ matrix.scope }}
          path: |
            backend-tail-evidence/
            ${{ runner.temp }}/backend-tail-capacity-before.json
            ${{ runner.temp }}/backend-tail-capacity-after.json
          if-no-files-found: error
          retention-days: 14
