      - name: Verify installation update and execution readiness
        env:
          CAIRN_RELEASE_SSH_HOST: ${{ vars.CAIRN_RELEASE_SSH_HOST }}
          CAIRN_RELEASE_SSH_USER: ${{ vars.CAIRN_RELEASE_SSH_USER }}
          CAIRN_RELEASE_SSH_KNOWN_HOSTS: ${{ vars.CAIRN_RELEASE_SSH_KNOWN_HOSTS }}
          CAIRN_RELEASE_SSH_KEY: ${{ secrets.CAIRN_RELEASE_SSH_KEY }}
          DEPLOY_INSTALLATION_IMAGE: ghcr.io/${{ github.repository_owner }}/cairn@${{ needs.resolve.outputs.digest || needs.image.outputs.digest }}
        run: node scripts/production-release.mjs verify

  plan-storage:
    name: Plan storage layout and version fence
    if: github.event_name == 'workflow_dispatch' && (inputs.ci-diagnostic == 'none' || inputs.ci-diagnostic == '') && inputs.plan-storage-reference != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install compilation dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev age e2fsprogs fakeroot
      - name: Qualify two actual source revisions on synthetic databases
        env:
          PLAN_STORAGE_OUTPUT: ${{ runner.temp }}/plan-storage-evidence
          PLAN_STORAGE_REFERENCE: ${{ inputs.plan-storage-reference }}
        run: node scripts/qualify-plan-storage.mjs "$PLAN_STORAGE_REFERENCE"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: plan-storage-qualification
          path: ${{ runner.temp }}/plan-storage-evidence/
          if-no-files-found: error
