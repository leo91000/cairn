name: Recovery qualification with managed build paths
on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact PR source commit to qualify
        type: string
        required: true
      reference-sha:
        description: Exact reference source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: recovery-qualification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    # Browser tests need only these binaries and the frontend, not the whole quality job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
      - name: Verify the exact qualified source
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
      - name: Prepare workspace-owned temporary and cache paths
        run: |
          mkdir -p .qualification/{tmp,cargo,rustup,cache,npm,pnpm,gradle,var-tmp,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install bindings toolchain for the required ublk transport
        run: sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" update -qq && sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" install -y --no-install-recommends libclang-dev
      - name: Build the browser-test backend and frontend
        run: |
          cargo build --locked --bin cairn --example native_storage_qualifier
          (cd target/debug && sha256sum cairn examples/native_storage_qualifier > qualification-sha256)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-backend
          path: |
            target/debug/cairn
            target/debug/qualification-sha256
            target/debug/examples/native_storage_qualifier
          retention-days: 1
  native-runtime:
    needs: build
    name: Native Linux ublk storage and process ownership (CPU workload)
    runs-on: ubuntu-latest
    # Allow slow kernel-module installation and the complete native qualification.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
      - name: Verify the exact qualified source
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
      - name: Prepare workspace-owned temporary and cache paths
        run: |
          mkdir -p .qualification/{tmp,cargo,rustup,cache,npm,pnpm,gradle,var-tmp,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - name: Preserve candidate binaries before the reference build
        run: |
          (cd target/debug && sha256sum -c qualification-sha256)
          mkdir -p candidate-native/examples
          cp target/debug/cairn candidate-native/cairn
          cp target/debug/examples/native_storage_qualifier candidate-native/examples/native_storage_qualifier
          sha256sum candidate-native/cairn candidate-native/examples/native_storage_qualifier > .qualification/candidate-sha256
      - name: Prepare disposable host block storage and synthetic S3
        run: |
          # The native fixture explicitly creates its isolated root in /var/tmp.
          # Back it with this runner's workspace without changing the fixture.
          chmod 1777 .qualification/var-tmp
          sudo mount --bind "$PWD/.qualification/var-tmp" /var/tmp
          sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" update -qq
          sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" install -y --no-install-recommends e2fsprogs python3-venv sudo uidmap iproute2 iptables libcap2-bin
          sudo modprobe tun
          sudo modprobe ip_tables
          sudo modprobe iptable_nat
          sudo modprobe ip6_tables
          sudo modprobe ip6table_nat
          if ! sudo modprobe ublk_drv; then
            sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          python3 -m venv .native-s3-test
          .native-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
          .native-s3-test/bin/python -m unittest discover -s scripts/tests -p test_native_s3_memory.py -v
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Identify the exact reference build
        id: native-reference-key
        env:
          EVENT_REFERENCE_SHA: ${{ inputs.reference-sha }}
        run: |
          native_reference_sha="$(python3 scripts/native_reference.py)"
          echo "sha=$native_reference_sha" >> "$GITHUB_OUTPUT"
          echo "key=native-reference-v2-$native_reference_sha-$ImageOS-$ImageVersion-rust1.97.1-dev0-default" >> "$GITHUB_OUTPUT"
          echo "artifact=native-reference-v2-$native_reference_sha-$ImageOS-$ImageVersion-rust1.97.1-dev0-default" >> "$GITHUB_OUTPUT"
      - name: Find the exact reference from an earlier attempt of this run
        id: native-reference-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_REFERENCE_ARTIFACT: ${{ steps.native-reference-key.outputs.artifact }}
        run: |
          native_reference_found="$(python3 scripts/native_reference.py artifact-available)"
          echo "found=$native_reference_found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.1
        if: steps.native-reference-artifact.outputs.found == 'true'
        with:
          name: ${{ steps.native-reference-key.outputs.artifact }}
          path: reference-native/
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/cache/restore@v6.1.0
        if: steps.native-reference-artifact.outputs.found != 'true'
        id: native-reference-cache
        with:
          path: reference-native/
          key: ${{ steps.native-reference-key.outputs.key }}
      - name: Build the exact base reference
        if: steps.native-reference-artifact.outputs.found != 'true' && steps.native-reference-cache.outputs.cache-hit != 'true'
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" -o Dir::Cache::pkgcache="$PWD/.qualification/apt/pkgcache.bin" -o Dir::Cache::srcpkgcache="$PWD/.qualification/apt/srcpkgcache.bin" install -y --no-install-recommends libclang-dev
          git fetch --no-tags origin "$REFERENCE_SHA"
          [[ "$REFERENCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git checkout --detach "$REFERENCE_SHA"
          test "$(git rev-parse HEAD)" = "$REFERENCE_SHA"
          cargo +1.97.1 build --locked --bin cairn --example native_storage_qualifier
          mkdir -p reference-native/examples
          cp target/debug/cairn reference-native/cairn
          cp target/debug/examples/native_storage_qualifier reference-native/examples/native_storage_qualifier
          git checkout --detach "${{ inputs.source-sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.source-sha }}"
          git diff --exit-code
          sha256sum -c .qualification/candidate-sha256
          python3 - <<'PYREF'
          import hashlib, json, os
          from pathlib import Path
          binaries = ['cairn', 'examples/native_storage_qualifier']
          checksums = {name: hashlib.sha256((Path('reference-native') / name).read_bytes()).hexdigest() for name in binaries}
          Path('reference-native/revision.json').write_text(json.dumps(dict(headSha=os.environ['REFERENCE_SHA'], profile='development, debug=0, incremental=0', features='default (ublk required)', rust='1.97.1', image=os.environ['ImageVersion'], buildRun=os.environ['GITHUB_RUN_ID'], sha256=checksums), indent=2))
          PYREF
      - uses: actions/cache/save@v6.1.0
        if: steps.native-reference-artifact.outputs.found != 'true' && steps.native-reference-cache.outputs.cache-hit != 'true'
        with:
          path: reference-native/
          key: ${{ steps.native-reference-key.outputs.key }}
      - name: Verify the exact reference binaries
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
        run: |
          python3 - <<'PYREF'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path('reference-native/revision.json').read_text())
          assert metadata['headSha'] == os.environ['REFERENCE_SHA']
          assert metadata['image'] == os.environ['ImageVersion']
          assert metadata['rust'] == '1.97.1' and metadata['features'] == 'default (ublk required)'
          assert metadata['profile'] == 'development, debug=0, incremental=0'
          assert set(metadata['sha256']) == {'cairn', 'examples/native_storage_qualifier'}
          for name, checksum in metadata['sha256'].items():
              assert hashlib.sha256((Path('reference-native') / name).read_bytes()).hexdigest() == checksum
          Path('native-storage-evidence/reference').mkdir(parents=True)
          Path('native-storage-evidence/reference/revision.json').write_text(json.dumps(metadata, indent=2))
          PYREF
      - uses: actions/upload-artifact@v7.0.1
        if: steps.native-reference-artifact.outputs.found != 'true'
        with:
          name: ${{ steps.native-reference-key.outputs.artifact }}
          path: reference-native/
          retention-days: 14
          if-no-files-found: error
      - name: Qualify the exact reference on the current disposable host
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
        run: |
          # Keep the reference's private protocol fixtures paired with its binaries.
          # The current S3 launcher still provides identical host/emulator conditions.
          git fetch --no-tags origin "$REFERENCE_SHA"
          reference_fixture="$PWD/.qualification/reference-fixture"
          mkdir -p "$reference_fixture"
          git archive "$REFERENCE_SHA" scripts/tests deploy/nodes/native-host.py | tar -x -C "$reference_fixture"
          python3 - "$reference_fixture/scripts/tests/native_runtime_test.py" <<'PYWATCHDOG'
          from pathlib import Path
          import sys
          fixture = Path(sys.argv[1])
          source = fixture.read_text()
          needle = "            api('/runs/' + earlier, method='DELETE')\n"
          probe = "            watchdog_done = threading.Event()\n            try:\n                device_ids = {}\n                for label, conversation in (('earlier', run), ('later', other)):\n                    device = (state / 'native' / conversation / 'data').stat().st_dev\n                    device_ids[label] = (os.major(device), os.minor(device))\n            except Exception as error:\n                device_ids = {}\n                print('Native watchdog identity capture failed: ' + type(error).__name__, flush=True)\n\n            def watchdog_snapshot():\n                if watchdog_done.wait(15) or len(device_ids) != 2:\n                    return\n                try:\n                    output = Path(os.environ['NATIVE_STORAGE_EVIDENCE_DIR']).parent / 'watchdog'\n                    output.mkdir(parents=True, exist_ok=True)\n                    units = [supervisor, 'cairn-native-' + earlier + '.service', 'cairn-native-' + later + '.service']\n                    roots = set()\n                    states = []\n                    for unit in units:\n                        result = subprocess.run(['systemctl', 'show', unit, '--property=ActiveState,SubState,MainPID', '--no-pager'], capture_output=True, text=True, timeout=5)\n                        fields = dict(line.split('=', 1) for line in result.stdout.splitlines() if '=' in line)\n                        pid = int(fields.get('MainPID', '0'))\n                        if pid > 0:\n                            roots.add(pid)\n                        states.append({'active': fields.get('ActiveState'), 'sub': fields.get('SubState'), 'pid': pid})\n                    processes = {}\n                    for proc in Path('/proc').iterdir():\n                        if not proc.name.isdigit():\n                            continue\n                        try:\n                            fields = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines() if ':' in line)\n                            processes[int(proc.name)] = int(fields['PPid'].strip())\n                        except (OSError, KeyError, ValueError):\n                            continue\n                    selected = set(roots)\n                    while True:\n                        children = {pid for pid, parent in processes.items() if parent in selected}\n                        if children <= selected:\n                            break\n                        selected.update(children)\n                    device_text = {label: f'{major}:{minor}' for label, (major, minor) in device_ids.items()}\n                    observations = []\n                    for pid in sorted(selected):\n                        proc = Path('/proc') / str(pid)\n                        threads = []\n                        for task in (proc / 'task').glob('[0-9]*'):\n                            try:\n                                lines = (task / 'mountinfo').read_text().splitlines()\n                                counts = {label: sum(len(fields) > 2 and fields[2] == device for fields in map(str.split, lines)) for label, device in device_text.items()}\n                                threads.append({'tid': int(task.name), 'mounts': counts})\n                            except OSError:\n                                threads.append({'tid': int(task.name), 'mounts': None})\n                        fd_counts = {label: {'filesystem': 0, 'device': 0} for label in device_ids}\n                        inaccessible_fds = 0\n                        try:\n                            fd_entries = list((proc / 'fd').iterdir())\n                        except OSError:\n                            fd_entries = []\n                            inaccessible_fds += 1\n                        for fd in fd_entries:\n                            if not fd.name.isdigit():\n                                continue\n                            try:\n                                metadata = fd.stat()\n                                for label, identity in device_ids.items():\n                                    if (os.major(metadata.st_dev), os.minor(metadata.st_dev)) == identity:\n                                        fd_counts[label]['filesystem'] += 1\n                                    if (stat.S_ISBLK(metadata.st_mode) or stat.S_ISCHR(metadata.st_mode)) and (os.major(metadata.st_rdev), os.minor(metadata.st_rdev)) == identity:\n                                        fd_counts[label]['device'] += 1\n                            except OSError:\n                                inaccessible_fds += 1\n                        observations.append({'pid': pid, 'ppid': processes.get(pid), 'threads': threads, 'fds': fd_counts, 'inaccessibleFds': inaccessible_fds})\n                    payload = {'deviceNumbers': device_text, 'unitsInOrder': states, 'processes': observations}\n                    (output / 'references.json').write_text(json.dumps(payload, indent=2) + '\\n')\n                except Exception as error:\n                    print('Native watchdog failed: ' + type(error).__name__, flush=True)\n            threading.Thread(target=watchdog_snapshot, daemon=True).start()\n            try:\n                api('/runs/' + earlier, method='DELETE')\n            finally:\n                watchdog_done.set()\n"
          assert source.count(needle) == 1
          fixture.write_text(source.replace(needle, probe))
          PYWATCHDOG
          chmod +x reference-native/cairn reference-native/examples/native_storage_qualifier
          sudo env TMPDIR="$TMPDIR" PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-storage-evidence/reference" .native-s3-test/bin/python scripts/tests/node_s3_test.py --repo "$reference_fixture" --native-runtime reference-native/cairn --qualifier reference-native/examples/native_storage_qualifier
      - name: Qualify real ublk, S3, eviction, systemd ownership and crash recovery
        run: |
          sha256sum -c .qualification/candidate-sha256
          chmod +x candidate-native/cairn candidate-native/examples/native_storage_qualifier
          mkdir -p native-storage-evidence
          sudo env TMPDIR="$TMPDIR" PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 CAIRN_NATIVE_DOCKER_QUALIFY=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-storage-evidence" .native-s3-test/bin/python scripts/tests/node_s3_test.py --native-runtime candidate-native/cairn --qualifier candidate-native/examples/native_storage_qualifier
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-storage-evidence
          path: native-storage-evidence/
          retention-days: 14
