name: Native S3 snapshot qualification
on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Exact source workflow ID for candidate binaries
        type: string
        default: '40840084692'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native-runtime:
    name: Native Linux ublk storage and process ownership (CPU workload)
    runs-on: ubuntu-latest
    # Allow slow kernel-module installation and the complete native qualification.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify candidate provenance and the exact fixture correction
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
        run: |
          test "$ARTIFACT_RUN" = 40840084692
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq .head_sha)
          test "$source_sha" = 1b79e3fc25c48a6488e68c5c0322af4de2f41c9e
          git fetch --no-tags origin "$source_sha" 3e20de835b92aa202037ac6b1e403a540d32db18
          SOURCE_SHA="$source_sha" python3 - <<'PY'
          import os
          import subprocess
          allowed = {'.github/workflows/ci.yaml', 'scripts/tests/node_s3_test.py', 'scripts/tests/test_native_s3_memory.py', 'scripts/tests/native_runtime_test.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['SOURCE_SHA'], 'HEAD'], text=True).splitlines())
          assert changed <= allowed, 'Candidate runtime or unrelated fixtures changed'
          fixed = set(subprocess.check_output(['git', 'diff', '--name-only', '3e20de835b92aa202037ac6b1e403a540d32db18', 'HEAD'], text=True).splitlines())
          assert fixed <= {'.github/workflows/ci.yaml'}, 'Qualification fixture differs from reviewed PR source'
          PY
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
          run-id: ${{ inputs.artifact-run }}
          github-token: ${{ github.token }}
      - name: Prepare disposable host block storage and synthetic S3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs python3-venv sudo uidmap iproute2 iptables libcap2-bin
          sudo modprobe tun
          sudo modprobe ip_tables
          sudo modprobe iptable_nat
          sudo modprobe ip6_tables
          sudo modprobe ip6table_nat
          if ! sudo modprobe ublk_drv; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          python3 -m venv .native-s3-test
          .native-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
          .native-s3-test/bin/python -m unittest discover -s scripts/tests -p test_native_s3_memory.py -v
      - name: Qualify real ublk, S3, eviction, systemd ownership and crash recovery
        run: |
          chmod +x target/debug/cairn target/debug/examples/native_storage_qualifier
          mkdir -p native-storage-evidence
          sudo env PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 CAIRN_NATIVE_DOCKER_QUALIFY=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-storage-evidence" .native-s3-test/bin/python scripts/tests/node_s3_test.py --native-runtime target/debug/cairn --qualifier target/debug/examples/native_storage_qualifier
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-storage-evidence
          path: native-storage-evidence/
          retention-days: 14
