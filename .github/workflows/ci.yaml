name: WebKit pageshow diagnostic (no native build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pageshow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Observe pinned production bootstrap and transport in WebKit
        timeout-minutes: 6
        run: node scripts/diagnose-browser-pageshow.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-pageshow-diagnostic
          path: browser-pageshow-evidence/
          retention-days: 14
