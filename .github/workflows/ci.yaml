name: Quality and container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      browser-workers:
        description: Workers per browser group for performance comparisons
        type: choice
        options: ['1', '2']
        default: '2'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      digest: ${{ steps.resolve.outputs.digest }}
      codex: ${{ steps.tools.outputs.codex }}
      gh: ${{ steps.tools.outputs.gh }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - name: Resolve current stable agent tools
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-updates.mjs build-versions
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ steps.tools.outputs.codex }}
          GH_VERSION: ${{ steps.tools.outputs.gh }}
        run: node scripts/resolve-release.mjs
  quality:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: rust-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-1.97.1-debug0-
      - name: Check formatting, lint, tests and frontend build
        run: pnpm check
      - run: |
          node --import tsx scripts/backend-schemas.mjs
          git diff --exit-code -- backend/schemas/inputs.json
          cargo clippy --locked --workspace --all-targets -- -D warnings
          node scripts/test-backend.mjs
          cargo build --locked --bin leo
      - name: Validate node supervisor and S3 recovery
        run: |
          python3 tests/guest_projects_test.py
          python3 tests/node_supervisor_test.py
          python3 -m venv .node-s3-test
          .node-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
          PATH="$PWD/.node-s3-test/bin:$PATH" .node-s3-test/bin/python tests/node_s3_test.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-backend
          path: target/debug/leo
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-build
          path: dist/
          retention-days: 1
  browser:
    name: browser (${{ matrix.group }})
    needs: [resolve, quality]
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Match @playwright/test; browsers and system libraries are already installed.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: journeys
            browser: chromium
            projects: journeys*
          - group: chromium
            browser: chromium
            projects: layout-chromium-*
          - group: webkit
            browser: webkit
            projects: layout-webkit-*
            shard: 1/2
          - group: webkit-extra
            browser: webkit
            projects: layout-webkit-*
            shard: 2/2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Check browser image version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          const preinstalled = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
          if (installed !== preinstalled)
            throw new Error(`Update the pinned browser image: Playwright package ${installed}, image ${preinstalled}`)
          JS
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: dist/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - run: chmod +x target/debug/leo
      - run: |
          args=(--project="$BROWSER_PROJECTS" --workers="$BROWSER_WORKERS")
          if [[ -n "$BROWSER_SHARD" ]]; then
            args+=(--shard="$BROWSER_SHARD")
          fi
          pnpm test:e2e "${args[@]}"
        env:
          BROWSER_PROJECTS: ${{ matrix.projects }}
          BROWSER_WORKERS: ${{ inputs.browser-workers || '2' }}
          BROWSER_SHARD: ${{ matrix.shard || '' }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 14
  image:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare KVM build host
        run: |
          test -e /dev/kvm
          sudo modprobe fuse
          test -c /dev/fuse
          # A working L0 device alone does not guarantee nested KVM for our guest.
          if grep -qw vmx /proc/cpuinfo; then
            grep -Eq '^(Y|1)$' /sys/module/kvm_intel/parameters/nested
          else
            grep -qw svm /proc/cpuinfo
            grep -Eq '^(Y|1)$' /sys/module/kvm_amd/parameters/nested
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - name: Use Docker's containerd image store
        if: github.event_name == 'pull_request'
        run: |
          if test -f /etc/docker/daemon.json; then
            sudo jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new > /dev/null
          else
            printf '%s\n' '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json.new > /dev/null
          fi
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}' | grep -q 'io.containerd.snapshotter.v1'
          docker buildx inspect default
      - uses: docker/setup-buildx-action@v4.3.0
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read package version
        id: package
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${require("./package.json").version}\n`)'
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          labels: org.opencontainers.image.version=${{ steps.package.outputs.version }}
      # Publish only an untagged digest. Release/latest tags wait for all checks.
      # PRs remain local and need no registry credentials or package writes.
      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          builder: ${{ github.event_name == 'pull_request' && 'default' || '' }}
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'leo-agent-manager:test' || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            CODEX_VERSION=${{ needs.resolve.outputs.codex }}
            GH_VERSION=${{ needs.resolve.outputs.gh }}
          # GHCR deduplicates layers across main builds. PRs read the trusted
          # main cache but skip the expensive cache upload on their critical path.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
            type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max,compression=zstd,compression-level=3,ignore-error=true', github.repository) || '' }}
          secrets: github_token=${{ github.token }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Smoke-test the exact image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_IMAGE: ${{ github.event_name == 'pull_request' && 'leo-agent-manager:test' || format('ghcr.io/{0}@{1}', github.repository, steps.build.outputs.digest) }}
        run: |
          node tests/container-smoke.mjs "$SMOKE_IMAGE"
          node tests/runner-smoke.mjs "$SMOKE_IMAGE"
      - name: Verify retained conversation memory, crash recovery and active admission
        env:
          SMOKE_IMAGE: ${{ github.event_name == 'pull_request' && 'leo-agent-manager:test' || format('ghcr.io/{0}@{1}', github.repository, steps.build.outputs.digest) }}
          LEO_RETENTION_MEMORY_GIB: 4
          LEO_RETENTION_TURNS: 4
          LEO_RETENTION_CRASH_AFTER: 2
          LEO_RETENTION_ADMISSION: 'true'
          LEO_RETENTION_PUBLISH: 'true'
        run: node tests/runner-retention-smoke.mjs "$SMOKE_IMAGE"
  publish:
    # The Intel nested Android test needs hardware GitHub does not provide; it runs locally
    # before releases when Android or runner changes need it (docs/DEPLOYMENT.md) and does not gate CI.
    needs: [resolve, quality, browser, image]
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.resolve.outputs.reuse != 'true' && needs.quality.result == 'success' && needs.browser.result == 'success' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Manifest promotion needs only the runner's Buildx client, no builder daemon.
      - run: docker buildx version
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Promote the tested digest
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
      - name: Record the validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CODEX_VERSION: ${{ needs.resolve.outputs.codex }}
          GH_VERSION: ${{ needs.resolve.outputs.gh }}
        run: |
          mkdir -p release-evidence
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync('release-evidence/image.json', JSON.stringify({ schema: 1, repository: process.env.GITHUB_REPOSITORY.toLowerCase(), commit: process.env.GITHUB_SHA, digest: process.env.IMAGE_DIGEST, runId: Number(process.env.GITHUB_RUN_ID), tools: { codex: process.env.CODEX_VERSION, gh: process.env.GH_VERSION } }))
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: validated-image
          path: release-evidence/image.json
          retention-days: 90
          overwrite: true
  deploy:
    if: always() && !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || needs.publish.result == 'success')
    needs: [resolve, image, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.LEO_PUBLIC_URL }}
    concurrency:
      group: coolify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: docker buildx version
        if: needs.resolve.outputs.reuse == 'true'
      - uses: docker/login-action@v4.6.0
        if: needs.resolve.outputs.reuse == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the validated digest to the release tag
        if: needs.resolve.outputs.reuse == 'true'
        env:
          IMAGE_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
      - name: Deploy the published image and verify the running commit
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          LEO_PUBLIC_URL: ${{ vars.LEO_PUBLIC_URL }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.resolve.outputs.digest || needs.image.outputs.digest }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-coolify.mjs
