name: Browser lifecycle qualification (manual selected normal jobs; never merge)
'on':
  workflow_dispatch:
    inputs:
      validation-only:
        type: boolean
        default: true
      backend-only:
        type: boolean
        default: false
      ci-diagnostic:
        type: choice
        options:
        - none
        default: none
      browser-workers:
        type: choice
        options:
        - '2'
        default: '2'
permissions:
  contents: read
concurrency:
  group: browser-lifecycle-qualification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    outputs:
      reuse: ${{ steps.source.outputs.reuse }}
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: 276c5431b4f3aa4e06a37d2d86807efc9252980d
    - name: Verify immutable candidate and closed qualification inputs
      id: source
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"before","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/before.json"
        cat "$RUNNER_TEMP/browser-qualification-source/before.json"
        echo 'reuse=false' >> "$GITHUB_OUTPUT"
        echo 'commit=276c5431b4f3aa4e06a37d2d86807efc9252980d' >> "$GITHUB_OUTPUT"
        echo 'tree=61e07c22b23e6f32ea4a73d2c1cde7d626efe08d' >> "$GITHUB_OUTPUT"
    - name: Verify frozen source after the complete selected job
      if: always()
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"after","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/after.json"
        cat "$RUNNER_TEMP/browser-qualification-source/after.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: source-evidence-resolve
        path: ${{ runner.temp }}/browser-qualification-source/
        if-no-files-found: error
        retention-days: 14
  build:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: 276c5431b4f3aa4e06a37d2d86807efc9252980d
    - name: Verify immutable candidate source before qualification
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"before","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/before.json"
        cat "$RUNNER_TEMP/browser-qualification-source/before.json"
    - uses: ./.github/actions/setup-pnpm
      with:
        cache: true
    - name: Acquire the pinned Ubuntu network package closure
      run: node scripts/ci-network-package-closure.mjs acquire target/ci-network-tools
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: network-tools-noble-amd64-v1
        path: target/ci-network-tools/
        retention-days: 1
    - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
    - name: Install bindings toolchain for the required ublk transport
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev
    - uses: ./.github/actions/observe-rust-build
      with:
        phase: before-build
    - name: Build the browser-test backend and frontend
      run: |
        cargo build --locked --bin cairn --example worker_fixture --example browser_fixture --example network_direct_client --example network_qualification --example native_storage_qualifier
        cargo build --locked -p cairn-beacon --bin cairn-beacon --example network_stun_server --example beacon_sql_fixture
        pnpm exec vite build --config apps/web/vite.config.ts
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: browser-backend
        path: |
          target/debug/cairn
          target/debug/cairn-beacon
          target/debug/examples/native_storage_qualifier
          target/debug/examples/worker_fixture
          target/debug/examples/browser_fixture
          target/debug/examples/beacon_sql_fixture
          target/debug/examples/network_direct_client
          target/debug/examples/network_qualification
          target/debug/examples/network_stun_server
        retention-days: 1
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: browser-build
        path: dist/
        retention-days: 1
    - uses: ./.github/actions/observe-rust-build
      if: always()
      with:
        phase: after-build
    - name: Verify frozen source after the complete selected job
      if: always()
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"after","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/after.json"
        cat "$RUNNER_TEMP/browser-qualification-source/after.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: source-evidence-build
        path: ${{ runner.temp }}/browser-qualification-source/
        if-no-files-found: error
        retention-days: 14
  browser:
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: --health-cmd "pg_isready -U cairn -d cairn_beacon_test" --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
    name: browser (${{ matrix.group }})
    needs:
    - resolve
    - build
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: journeys-1
          projects: journeys*
          shard: 1/4
        - group: journeys-2
          projects: journeys*
          shard: 2/4
        - group: journeys-3
          projects: journeys*
          shard: 3/4
        - group: journeys-4
          projects: journeys*
          shard: 4/4
        - group: chromium-1
          projects: layout-chromium-*
        - group: webkit-1
          projects: layout-webkit-*
          shard: 1/4
        - group: webkit-2
          projects: layout-webkit-*
          shard: 2/4
        - group: webkit-3
          projects: layout-webkit-*
          shard: 3/4
        - group: webkit-4
          projects: layout-webkit-*
          shard: 4/4
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: 276c5431b4f3aa4e06a37d2d86807efc9252980d
    - name: Verify immutable candidate source before qualification
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"before","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/before.json"
        cat "$RUNNER_TEMP/browser-qualification-source/before.json"
    - uses: ./.github/actions/setup-pnpm
      with:
        cache: true
    - name: Check browser image version
      run: |
        node --input-type=module <<'JS'
        import { readFileSync } from 'node:fs'
        const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
        const preinstalled = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
        if (installed !== preinstalled)
          throw new Error(`Update the pinned browser image: Playwright package ${installed}, image ${preinstalled}`)
        JS
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-build
        path: dist/
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-backend
        path: target/debug/
    - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client
        target/debug/examples/worker_fixture target/debug/examples/beacon_sql_fixture
    - name: Qualify the bundled SQL fixture against disposable Postgres
      run: pnpm exec tsx scripts/qualify-beacon-sql-fixture.ts
    - name: Run browser shard
      timeout-minutes: 10
      run: |
        args=(--project="$BROWSER_PROJECTS" --workers="$BROWSER_WORKERS" --fail-on-flaky-tests)
        if [[ -n "$BROWSER_SHARD" ]]; then
          args+=(--shard="$BROWSER_SHARD")
        fi
        pnpm test:e2e "${args[@]}"
      env:
        BROWSER_PROJECTS: ${{ matrix.projects }}
        BROWSER_WORKERS: ${{ inputs.browser-workers || '2' }}
        BROWSER_SHARD: ${{ matrix.shard || '' }}
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: browser-evidence-${{ matrix.group }}
        path: |
          playwright-report/
          test-results/
          docs/screenshots/
        retention-days: 14
    - name: Verify frozen source after the complete selected job
      if: always()
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        case '${{ matrix.group }}' in
          journeys-1|journeys-2|journeys-3|journeys-4)
            # The unchanged workspace journey regenerates these tracked evidence files.
            # Keep every source and staged byte protected; do not claim clean images.
            source_git diff --cached --quiet
            source_git diff --quiet -- . ':(exclude)docs/screenshots/overview-desktop.png' ':(exclude)docs/screenshots/overview-mobile.png'
            for evidence_path in docs/screenshots/overview-desktop.png docs/screenshots/overview-mobile.png; do
              test -f "$evidence_path"
              test ! -L "$evidence_path"
              test ! -x "$evidence_path"
            done
            allowed_evidence='["docs/screenshots/overview-desktop.png","docs/screenshots/overview-mobile.png"]'
            if source_git diff --quiet; then
              :
            else
              diff_status=$?
              test "$diff_status" = 1
              tracked_clean=false
            fi
            ;;
          *)
            source_git diff --quiet
            source_git diff --cached --quiet
            ;;
        esac
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"after","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/after.json"
        cat "$RUNNER_TEMP/browser-qualification-source/after.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: source-evidence-browser-${{ matrix.group }}
        path: ${{ runner.temp }}/browser-qualification-source/
        if-no-files-found: error
        retention-days: 14
  network-bench:
    name: direct-relay network bench (${{ matrix.group }})
    needs:
    - resolve
    - build
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: lan
          scenarios: same-lan mdns-only-client same-server
        - group: nat
          scenarios: nat-client nat-installation nat-both
        - group: fallback
          scenarios: udp-blocked symmetric-nat symmetric-client
        - group: recovery
          scenarios: network-change packet-loss
        - group: qualification
          scenarios: qualification
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cairn -d cairn_beacon_test" --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: 276c5431b4f3aa4e06a37d2d86807efc9252980d
    - name: Verify immutable candidate source before qualification
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
        printf '{"observer":"%s","candidate":"%s","tree":"%s","phase":"before","trackedClean":%s,"trackedSourceClean":true,"allowedGeneratedEvidence":%s,"sourceIdentityVerified":true,"releaseProvenance":false}\n' '${{ github.sha }}' "$checked_head" "$checked_tree" "$tracked_clean" "$allowed_evidence" > "$RUNNER_TEMP/browser-qualification-source/before.json"
        cat "$RUNNER_TEMP/browser-qualification-source/before.json"
    - uses: ./.github/actions/setup-pnpm
      with:
        cache: true
    - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
    - uses: actions/download-artifact@v8.0.1
      with:
        name: network-tools-noble-amd64-v1
        path: target/ci-network-tools/
    - name: Prepare the complete network-suite toolchain
      run: node scripts/prepare-network-tools.mjs network-bench
    - run: pnpm exec playwright install --with-deps chromium
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-build
        path: dist/
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-backend
        path: target/debug/
    - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client
        target/debug/examples/network_stun_server target/debug/examples/beacon_sql_fixture
    - run: chmod +x target/debug/examples/network_qualification
    - run: pnpm exec vite build --config tests/network-qualification.vite.ts
    - name: Validate real network topology and authenticated sessions
      env:
        NETWORK_SCENARIOS: ${{ matrix.scenarios }}
      run: |
        python3 tests/network_probe_test.py
        python3 tests/network_bench_test.py
        python3 tests/stun_docker_test.py
        node --test tests/network-phase-diagnostics.test.mjs
        for scenario in $NETWORK_SCENARIOS; do
          python3 tests/network-bench.py "$scenario" --output "test-results/network/$scenario.json"
        done
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: direct-relay-network-evidence-${{ matrix.group }}
        path: test-results/network/
        retention-days: 14
    - name: Verify frozen source after the complete selected job
      if: always()
      run: |
        set -euo pipefail
        test "${{ github.repository }}" = 'leo91000/cairn'
        test "${{ github.event_name }}" = 'workflow_dispatch'
        test "${{ github.ref }}" = 'refs/heads/qualification/browser-lifecycle-20261108'
        test "${{ inputs.validation-only }}" = 'true'
        test "${{ inputs.backend-only }}" = 'false'
        test "${{ inputs.ci-diagnostic }}" = 'none'
        test "${{ inputs.browser-workers }}" = '2'
        source_git() {
          command git -c safe.directory="$GITHUB_WORKSPACE" "$@"
        }
        checked_head="$(source_git rev-parse HEAD)"
        checked_tree="$(source_git rev-parse 'HEAD^{tree}')"
        test "$checked_head" = '276c5431b4f3aa4e06a37d2d86807efc9252980d'
        test "$checked_tree" = '61e07c22b23e6f32ea4a73d2c1cde7d626efe08d'
        tracked_clean=true
        allowed_evidence='[]'
        source_git diff --quiet
        source_git diff --cached --quiet
        mkdir -p "$RUNNER_TEMP/browser-qualification-source"
