name: Quality and container
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact product source commit to qualify
        type: string
        required: true
      reference-sha:
        description: Exact first parent of the product source commit
        type: string
        required: true
      backend-only:
        description: Run backend tests and doctests without release resolution or image jobs
        type: boolean
        default: false
      backend-qualification:
        description: Run physical backend migration in a separate job after the backend suite
        type: choice
        options: [none, backend-migration]
        default: none
      validation-only:
        description: Run qualifications without building or publishing container images
        type: boolean
        default: false
      browser-workers:
        description: Workers per browser group for performance comparisons
        type: choice
        options: ['1', '2']
        default: '2'
      exclusive-android:
        description: Qualify live nested Android continuity on a compatible host
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.source.outputs.reuse }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      reference_sha: ${{ steps.source.outputs.reference_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      reference_tree: ${{ steps.source.outputs.reference_tree }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
    steps:
      - name: Validate immutable product and reference inputs
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          REFERENCE_SHA: ${{ inputs.reference-sha }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('SOURCE_SHA', 'REFERENCE_SHA'):
              value = os.environ[name]
              if re.fullmatch(r'[0-9a-f]{40}', value) is None or value == '0' * 40:
                  raise SystemExit(name + ' must be a nonzero full commit SHA.')
          PY
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 2
      - name: Verify and record product source separately from workflow source
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          REFERENCE_SHA: ${{ inputs.reference-sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source, reference = os.environ['SOURCE_SHA'], os.environ['REFERENCE_SHA']
          if git('rev-parse', 'HEAD') != source:
              raise SystemExit('Checkout differs from the requested product source.')
          if git('rev-parse', 'HEAD^1') != reference:
              raise SystemExit('Reference is not the exact product first parent.')
          proof = dict(sourceSha=source, sourceTree=git('rev-parse', 'HEAD^{tree}'),
                       referenceSha=reference, referenceTree=git('rev-parse', reference + '^{tree}'),
                       workflowSha=os.environ['GITHUB_SHA'], workflowRef=os.environ['GITHUB_WORKFLOW_REF'])
          Path('native-source-resolution.json').write_text(json.dumps(proof, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(reuse='false', source_sha=source, reference_sha=reference,
                                    source_tree=proof['sourceTree'], reference_tree=proof['referenceTree'],
                                    workflow_sha=proof['workflowSha']).items():
                  output.write(key + '=' + value + '\n')
          print('NATIVE_SOURCE_QUALIFICATION ' + json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-source-resolution
          path: native-source-resolution.json
          retention-days: 14
          if-no-files-found: error
  build:
    # Browser tests need only these binaries and the frontend, not the whole quality job.
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Acquire the pinned Ubuntu network package closure
        run: node scripts/ci-network-package-closure.mjs acquire target/ci-network-tools
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: network-tools-noble-amd64-v1
          path: target/ci-network-tools/
          retention-days: 1
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install bindings toolchain for the required ublk transport
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: ./.github/actions/observe-rust-build
        with:
          phase: before-build
      - name: Build the browser-test backend and frontend
        run: |
          cargo build --locked --bin cairn --example worker_fixture --example browser_fixture --example network_direct_client --example network_qualification --example native_storage_qualifier
          cargo build --locked -p cairn-beacon --bin cairn-beacon --example network_stun_server --example beacon_sql_fixture
          pnpm exec vite build --config apps/web/vite.config.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-backend
          path: |
            target/debug/cairn
            target/debug/cairn-beacon
            target/debug/examples/native_storage_qualifier
            target/debug/examples/worker_fixture
            target/debug/examples/browser_fixture
            target/debug/examples/beacon_sql_fixture
            target/debug/examples/network_direct_client
            target/debug/examples/network_qualification
            target/debug/examples/network_stun_server
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-build
          path: dist/
          retention-days: 1
      - uses: ./.github/actions/observe-rust-build
        if: always()
        with:
          phase: after-build
  node-checks:
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Hosted Ubuntu package downloads can consume over 20 minutes before fixtures run.
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@localhost:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev age e2fsprogs fakeroot
      - uses: ./.github/actions/observe-rust-build
        with:
          phase: before-build
      - name: Prepare the installation host's required ublk driver
        run: |
          if ! sudo modprobe ublk_drv; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
      - name: Build the frontend used by installer and update fixtures
        run: pnpm exec vite build --config apps/web/vite.config.ts
      - name: Validate node supervisor and S3 recovery
        run: |
          python3 scripts/tests/guest_trim_test.py
          python3 scripts/tests/guest_projects_test.py
          python3 scripts/tests/node_supervisor_test.py
          python3 deploy/nodes/test_native_host.py
          bash -n deploy/nodes/native-install.sh
          python3 scripts/tests/installation_installer_test.py
          python3 scripts/tests/compressed_swap_test.py
          python3 scripts/tests/installation_updates_test.py
          python3 scripts/tests/production_release_test.py
          bash tests/installation-installer-container.sh
          python3 tests/installation_update_containers.py
          python3 -m venv .node-s3-test
          .node-s3-test/bin/pip install 'moto[server]==5.2.3' awscli blake3==1.0.8
          .node-s3-test/bin/python scripts/tests/storage_observer_test.py
          .node-s3-test/bin/python scripts/tests/storage_sample_test.py
          PATH="$PWD/.node-s3-test/bin:$PATH" .node-s3-test/bin/python scripts/tests/node_s3_test.py
      - uses: ./.github/actions/observe-rust-build
        if: always()
        with:
          phase: after-build
  native-runtime:
    name: Native Linux ublk storage and process ownership (CPU workload)
    needs: [resolve, build]
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # Allow slow kernel-module installation and the complete native qualification.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - name: Establish bounded low-free-space Native proof
        id: native-low-space
        timeout-minutes: 2
        env:
          PROOF_REFERENCE_SHA: ${{ needs.resolve.outputs.reference_sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          import { randomUUID } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const user = os.userInfo()
          if (process.platform !== 'linux' || user.username !== 'runner'
            || process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted'
            || process.env.GITHUB_JOB !== 'native-runtime' || !/^ubuntu\d+$/.test(process.env.ImageOS || '')
            || !/^\d{8}\.\d+\.\d+$/.test(process.env.ImageVersion || ''))
            throw new Error('Low-space proof requires its disposable GitHub-hosted Native runner.')
          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE)
          const temporary = fs.realpathSync(process.env.RUNNER_TEMP)
          if (fs.realpathSync(process.cwd()) !== workspace || !path.isAbsolute(temporary))
            throw new Error('Unexpected proof workspace or temporary directory.')
          const locations = [...new Set([workspace, temporary, '/tmp', '/var/tmp', '/', os.tmpdir()])]
          const device = fs.statSync(workspace).dev
          const filesystems = locations.map(location => {
            const stat = fs.statSync(location)
            const filesystem = fs.statfsSync(location, { bigint: true })
            if (stat.dev !== device)
              throw new Error('Controlled low space must cover every Native allocation filesystem.')
            return { path: location, device: stat.dev, totalBytes: `${filesystem.blocks * filesystem.bsize}` }
          })
          const available = () => {
            const stat = fs.statfsSync(workspace, { bigint: true })
            return stat.bavail * stat.bsize
          }
          const before = available()
          const minimum = 14n * 1024n ** 3n
          const retained = minimum + 64n * 1024n ** 2n
          if (before < retained)
            throw new Error(`Runner has only ${before} bytes before proof reservation.`)
          const bytes = before - retained
          if (bytes > 128n * 1024n ** 3n)
            throw new Error('Proof reservation exceeds its fixed 128-GiB allocation ceiling.')
          const reservation = path.join(temporary, `cairn-native-low-space-${randomUUID()}.reserve`)
          const descriptor = fs.openSync(reservation, 'wx', 0o600)
          let recorded = false
          try {
            if (bytes > 0n)
              execFileSync('fallocate', ['--length', `${bytes}`, '/proc/self/fd/3'], { stdio: ['ignore', 'inherit', 'inherit', descriptor], timeout: 60000 })
            const atStart = available()
            console.log(JSON.stringify({ phase: 'low-space-start', beforeBytes: `${before}`, availableBytes: `${atStart}`, reservationBytes: `${bytes}` }))
            if (atStart < minimum || atStart > minimum + 128n * 1024n ** 2n)
              throw new Error('Could not establish 14–14.125 GiB for the complete Native job.')
            const stat = fs.fstatSync(descriptor)
            const report = {
              sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
              referenceSha: process.env.PROOF_REFERENCE_SHA,
              workflowSha: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
              imageVersion: process.env.ImageVersion,
              filesystems,
              beforeBytes: `${before}`,
              availableAtStartBytes: `${atStart}`,
              reservation: { path: reservation, device: stat.dev, inode: stat.ino, uid: stat.uid, size: stat.size },
            }
            fs.mkdirSync('native-storage-evidence', { recursive: true })
            fs.writeFileSync('native-storage-evidence/low-space-proof.json', JSON.stringify(report, null, 2) + '\n', { flag: 'wx', mode: 0o600 })
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'created=true\n')
            recorded = true
          } finally {
            fs.closeSync(descriptor)
            if (!recorded)
              fs.unlinkSync(reservation)
          }
          JS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-low-space-start
          path: native-storage-evidence/low-space-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare disposable host block storage and synthetic S3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs python3-venv sudo uidmap iproute2 iptables libcap2-bin
          sudo modprobe tun
          sudo modprobe ip_tables
          sudo modprobe iptable_nat
          sudo modprobe ip6_tables
          sudo modprobe ip6table_nat
          if ! sudo modprobe ublk_drv; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          python3 -m venv .native-s3-test
          .native-s3-test/bin/pip install 'moto[server]==5.2.3' awscli
          .native-s3-test/bin/python -m unittest discover -s scripts/tests -p test_native_s3_memory.py -v
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Identify the exact reference build
        id: native-reference-key
        env:
          EVENT_REFERENCE_SHA: ${{ needs.resolve.outputs.reference_sha }}
        run: |
          native_reference_sha="$(python3 scripts/native_reference.py)"
          echo "sha=$native_reference_sha" >> "$GITHUB_OUTPUT"
          echo "key=native-reference-v2-$native_reference_sha-$ImageOS-$ImageVersion-rust1.97.1-dev0-default" >> "$GITHUB_OUTPUT"
          echo "artifact=native-reference-v2-$native_reference_sha-$ImageOS-$ImageVersion-rust1.97.1-dev0-default" >> "$GITHUB_OUTPUT"
      - name: Build the exact base reference
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          sudo apt-get install -y --no-install-recommends libclang-dev
          git fetch --no-tags origin "$REFERENCE_SHA"
          git worktree add --detach /tmp/cairn-native-reference "$REFERENCE_SHA"
          CARGO_TARGET_DIR="$PWD/reference-target" cargo +1.97.1 build --locked --manifest-path /tmp/cairn-native-reference/Cargo.toml --bin cairn --example native_storage_qualifier
          mkdir -p reference-native/examples
          cp reference-target/debug/cairn reference-native/cairn
          cp reference-target/debug/examples/native_storage_qualifier reference-native/examples/native_storage_qualifier
          python3 - <<'PYREF'
          import hashlib, json, os
          from pathlib import Path
          binaries = ['cairn', 'examples/native_storage_qualifier']
          checksums = {name: hashlib.sha256((Path('reference-native') / name).read_bytes()).hexdigest() for name in binaries}
          Path('reference-native/revision.json').write_text(json.dumps(dict(headSha=os.environ['REFERENCE_SHA'], profile='development, debug=0, incremental=0', features='default (ublk required)', rust='1.97.1', image=os.environ['ImageVersion'], buildRun=os.environ['GITHUB_RUN_ID'], sha256=checksums), indent=2))
          PYREF
      - name: Verify the exact reference binaries
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
        run: |
          python3 - <<'PYREF'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path('reference-native/revision.json').read_text())
          assert metadata['headSha'] == os.environ['REFERENCE_SHA']
          assert metadata['image'] == os.environ['ImageVersion']
          assert metadata['rust'] == '1.97.1' and metadata['features'] == 'default (ublk required)'
          assert metadata['profile'] == 'development, debug=0, incremental=0'
          assert set(metadata['sha256']) == {'cairn', 'examples/native_storage_qualifier'}
          for name, checksum in metadata['sha256'].items():
              assert hashlib.sha256((Path('reference-native') / name).read_bytes()).hexdigest() == checksum
          Path('native-storage-evidence/reference').mkdir(parents=True)
          Path('native-storage-evidence/reference/revision.json').write_text(json.dumps(metadata, indent=2))
          PYREF
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.native-reference-key.outputs.artifact }}
          path: reference-native/
          retention-days: 14
          if-no-files-found: error
      - name: Verify the reference was compiled cold in this proof run
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('reference-native/revision.json').read_text())
          assert metadata['buildRun'] == os.environ['GITHUB_RUN_ID'], 'Proof reused a reference build.'
          assert Path('reference-target/debug/cairn').is_file(), 'Cold reference build outputs are missing.'
          PY
      - name: Qualify the exact reference on the current disposable host
        env:
          REFERENCE_SHA: ${{ steps.native-reference-key.outputs.sha }}
        run: |
          # Keep the reference's private protocol fixtures paired with its binaries.
          # The current S3 launcher still provides identical host/emulator conditions.
          git fetch --no-tags origin "$REFERENCE_SHA"
          reference_fixture="$RUNNER_TEMP/cairn-native-reference-fixture"
          mkdir -p "$reference_fixture"
          git archive "$REFERENCE_SHA" scripts/tests deploy/nodes/native-host.py | tar -x -C "$reference_fixture"
          python3 -B scripts/tests/native_admission_overlay.py "$reference_fixture" reference
          chmod +x reference-native/cairn reference-native/examples/native_storage_qualifier
          sudo env PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-storage-evidence/reference" .native-s3-test/bin/python scripts/tests/node_s3_test.py --repo "$reference_fixture" --native-runtime reference-native/cairn --qualifier reference-native/examples/native_storage_qualifier
      - name: Qualify real ublk, S3, eviction, systemd ownership and crash recovery
        run: |
          chmod +x target/debug/cairn target/debug/examples/native_storage_qualifier
          mkdir -p native-storage-evidence
          candidate_fixture="$RUNNER_TEMP/cairn-native-candidate-fixture"
          mkdir -p "$candidate_fixture"
          git archive HEAD scripts/tests deploy/nodes/native-host.py | tar -x -C "$candidate_fixture"
          python3 -B scripts/tests/native_admission_overlay.py "$candidate_fixture" candidate
          sudo env PATH="$PWD/.native-s3-test/bin:$PATH" CAIRN_NATIVE_DISPOSABLE_HOST=1 CAIRN_NATIVE_DOCKER_QUALIFY=1 NATIVE_STORAGE_EVIDENCE_DIR="$PWD/native-storage-evidence" .native-s3-test/bin/python scripts/tests/node_s3_test.py --repo "$candidate_fixture" --native-runtime target/debug/cairn --qualifier target/debug/examples/native_storage_qualifier
      - name: Record final allocation and release only the owned proof reservation
        if: always() && steps.native-low-space.outputs.created == 'true'
        timeout-minutes: 1
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          const user = os.userInfo()
          if (process.platform !== 'linux' || user.username !== 'runner'
            || process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted'
            || process.env.GITHUB_JOB !== 'native-runtime')
            throw new Error('Proof release requires its disposable GitHub-hosted Native runner.')
          const filename = 'native-storage-evidence/low-space-proof.json'
          const report = JSON.parse(fs.readFileSync(filename, 'utf8'))
          const reservation = report.reservation
          if (report.runId !== process.env.GITHUB_RUN_ID || report.workflowSha !== process.env.GITHUB_SHA
            || path.dirname(reservation.path) !== fs.realpathSync(process.env.RUNNER_TEMP)
            || !/^cairn-native-low-space-[0-9a-f-]{36}\.reserve$/.test(path.basename(reservation.path)))
            throw new Error('Refusing an unowned proof reservation.')
          const available = () => {
            const filesystem = fs.statfsSync(process.cwd(), { bigint: true })
            return `${filesystem.bavail * filesystem.bsize}`
          }
          const descriptor = fs.openSync(reservation.path, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW)
          try {
            const stat = fs.fstatSync(descriptor)
            if (!stat.isFile() || stat.nlink !== 1 || stat.dev !== reservation.device || stat.ino !== reservation.inode
              || stat.uid !== user.uid || stat.uid !== reservation.uid || stat.size !== reservation.size)
              throw new Error('Proof reservation identity changed.')
            report.availableBeforeReleaseBytes = available()
            fs.unlinkSync(reservation.path)
          } finally {
            fs.closeSync(descriptor)
          }
          report.availableAfterReleaseBytes = available()
          report.released = true
          fs.writeFileSync(filename, JSON.stringify(report, null, 2) + '\n')
          console.log(JSON.stringify(report))
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-storage-evidence
          path: native-storage-evidence/
          retention-days: 14
