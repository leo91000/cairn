name: Signal final-source targeted qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@postgres:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: bc823b4ebaa69473e7315366db4d98933b47c6d2
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Verify qualified application inputs and browser version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p signal-evidence
          python3 - <<'PYVERIFY'
          import hashlib, json, shlex, subprocess
          from pathlib import Path
          reference = 'ed6d1f81e213dc868546471e16ab2e9a4437fac5'
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = {'Dockerfile', '.dockerignore'}
          for line in Path('Dockerfile').read_text().splitlines():
              if not line.startswith('COPY ') or '--from=' in line:
                  continue
              tokens = [token for token in shlex.split(line)[1:] if not token.startswith('--')]
              paths.update(tokens[:-1])
          rows = []
          for sha in (reference, source):
              data = subprocess.check_output(['git', 'ls-tree', '-rz', sha, '--', *sorted(paths)])
              rows.append(dict(source=sha, sha256=hashlib.sha256(data).hexdigest(), entries=len(data.split(b'\0')) - 1))
          assert rows[0]['sha256'] == rows[1]['sha256'] == 'bfe97146f0286974f16849f300d81ddeb0e7fab36f5af431b0c5d3f025f0b072'
          evidence = dict(referenceRun=40715586054, reference=reference, source=source, inputs=rows, signalBlob=subprocess.check_output(['git', 'rev-parse', 'HEAD:tests/e2e/signal.spec.ts'], text=True).strip())
          Path('signal-evidence/inputs.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PYVERIFY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const installed = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version
          const preinstalled = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion
          assert.equal(installed, preinstalled)
          console.log({ installed, preinstalled })
          JS
      - name: Install fixture PostgreSQL client and archive extractor
        run: apt-get update -qq && apt-get install -y --no-install-recommends postgresql-client unzip
      - name: Reuse and verify immutable qualified browser artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { mkdir, rm, writeFile } from 'node:fs/promises'
          const reference = 'ed6d1f81e213dc868546471e16ab2e9a4437fac5'
          const artifacts = [
            { id: 12829460474, name: 'browser-backend', digest: 'sha256:6366f9645daa4085ece215b64c5037a1aca0b4d273dacb6491f6b41858711671', path: 'target/debug' },
            { id: 12827578526, name: 'browser-build', digest: 'sha256:2fd200c6f86b31c8da7502deb7d003b23584b84fda99cd74037081613361904a', path: 'dist' },
          ]
          const headers = { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
          for (const artifact of artifacts) {
            const url = 'https://api.github.com/repos/leo91000/cairn/actions/artifacts/' + artifact.id
            const response = await fetch(url, { headers })
            assert.ok(response.ok, 'Artifact metadata HTTP ' + response.status)
            const meta = await response.json()
            assert.equal(meta.name, artifact.name)
            assert.equal(meta.digest, artifact.digest)
            assert.equal(meta.expired, false)
            assert.equal(meta.workflow_run.head_sha, reference)
            assert.equal(meta.workflow_run.id, 40715586054)
            const redirect = await fetch(url + '/zip', { headers, redirect: 'manual' })
            const archive = redirect.status === 302 ? await fetch(redirect.headers.get('location')) : redirect
            assert.ok(archive.ok, 'Artifact archive HTTP ' + archive.status)
            const bytes = Buffer.from(await archive.arrayBuffer())
            const digest = 'sha256:' + createHash('sha256').update(bytes).digest('hex')
            assert.equal(digest, artifact.digest)
            const file = 'signal-evidence/' + artifact.name + '.zip'
            await writeFile(file, bytes)
            await mkdir(artifact.path, { recursive: true })
            execFileSync('unzip', ['-q', file, '-d', artifact.path], { stdio: 'inherit' })
            await rm(file)
            console.log({ artifact: artifact.name, id: artifact.id, digest, source: reference })
          }
          await writeFile('signal-evidence/artifacts.json', JSON.stringify(artifacts, null, 2) + '\n')
          JS
          chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/worker_fixture
          sha256sum target/debug/cairn target/debug/cairn-beacon target/debug/examples/browser_fixture target/debug/examples/worker_fixture > signal-evidence/binaries.sha256
      - name: Qualify both complete Signal projects without retries
        run: |
          set -o pipefail
          env -u CAIRN_NODE_BACKEND pnpm test:e2e signal.spec.ts --project=journeys-signal --project=layout-webkit-signal --workers=2 --retries=0 2>&1 | tee signal-evidence/tests.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: signal-final-source-evidence
          path: |
            signal-evidence/
            test-results/
            playwright-report/
          retention-days: 14
