name: Disposable direct-network qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disposable-network-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    # Browser tests need only these binaries and the frontend, not the whole quality job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_TEMP: ${{ github.workspace }}/.qualification/tmp
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.qualification/tool-cache
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7c6dee0c42e92c9c79d385b16e71924328677043
      - name: Verify source and configure workspace paths
        run: |
          test "$(git rev-parse HEAD)" = 7c6dee0c42e92c9c79d385b16e71924328677043
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
          mkdir -p .qualification/{tmp,tool-cache,cargo,rustup,cache,npm,pnpm,gradle,android,android-home,playwright,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$PWD/.qualification/pnpm/store" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$PWD/.qualification/android-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$PWD/.qualification/android-home/avd" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/.qualification/playwright" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install bindings toolchain for the required ublk transport
        run: sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" update -qq && sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" install -y --no-install-recommends libclang-dev
      - name: Build the browser-test backend and frontend
        run: |
          cargo build --locked --bin cairn --example worker_fixture --example browser_fixture --example network_direct_client --example network_qualification --example native_storage_qualifier
          cargo build --locked -p cairn-beacon --bin cairn-beacon --example network_stun_server
          pnpm exec vite build --config apps/web/vite.config.ts
      - run: (cd target/debug && sha256sum cairn cairn-beacon examples/native_storage_qualifier examples/worker_fixture examples/browser_fixture examples/network_direct_client examples/network_qualification examples/network_stun_server > qualification-sha256)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-backend
          path: |
            target/debug/qualification-sha256
            target/debug/cairn
            target/debug/cairn-beacon
            target/debug/examples/native_storage_qualifier
            target/debug/examples/worker_fixture
            target/debug/examples/browser_fixture
            target/debug/examples/network_direct_client
            target/debug/examples/network_qualification
            target/debug/examples/network_stun_server
          retention-days: 1
      - run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../.qualification/browser-sha256)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-build
          path: |
            dist/
            .qualification/browser-sha256
          include-hidden-files: true
          retention-days: 1
  network-bench:
    name: direct-relay network bench (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lan
            scenarios: same-lan mdns-only-client same-server
          - group: nat
            scenarios: nat-client nat-installation nat-both
          - group: fallback
            scenarios: udp-blocked symmetric-nat symmetric-client
          - group: recovery
            scenarios: network-change packet-loss
          - group: qualification
            scenarios: qualification
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNNER_TEMP: ${{ github.workspace }}/.qualification/tmp
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.qualification/tool-cache
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7c6dee0c42e92c9c79d385b16e71924328677043
      - name: Verify source and configure workspace paths
        run: |
          test "$(git rev-parse HEAD)" = 7c6dee0c42e92c9c79d385b16e71924328677043
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
          mkdir -p .qualification/{tmp,tool-cache,cargo,rustup,cache,npm,pnpm,gradle,android,android-home,playwright,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$PWD/.qualification/pnpm/store" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$PWD/.qualification/android-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$PWD/.qualification/android-home/avd" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/.qualification/playwright" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" update -qq && sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" install -y --no-install-recommends iproute2 iptables conntrack util-linux
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: .
      - run: (cd dist && sha256sum -c ../.qualification/browser-sha256)
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - run: (cd target/debug && sha256sum -c qualification-sha256)
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - run: chmod +x target/debug/examples/network_qualification
      - run: pnpm exec vite build --config tests/network-qualification.vite.ts
      - name: Validate real network topology and authenticated sessions
        env:
          NETWORK_SCENARIOS: ${{ matrix.scenarios }}
        run: |
          python3 tests/network_probe_test.py
          python3 tests/network_bench_test.py
          python3 tests/stun_docker_test.py
          for scenario in $NETWORK_SCENARIOS; do
            python3 tests/network-bench.py "$scenario" --output "test-results/network/$scenario.json"
          done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: direct-relay-network-evidence-${{ matrix.group }}
          path: test-results/network/
          retention-days: 14
  android-direct-build:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: ${{ github.workspace }}/.qualification/tmp
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.qualification/tool-cache
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7c6dee0c42e92c9c79d385b16e71924328677043
      - name: Verify source and configure workspace paths
        run: |
          test "$(git rev-parse HEAD)" = 7c6dee0c42e92c9c79d385b16e71924328677043
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
          mkdir -p .qualification/{tmp,tool-cache,cargo,rustup,cache,npm,pnpm,gradle,android,android-home,playwright,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$PWD/.qualification/pnpm/store" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$PWD/.qualification/android-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$PWD/.qualification/android-home/avd" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/.qualification/playwright" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build the native client and instrumented tests
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - run: (cd apps/android/app/build/outputs/apk && sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > qualification-sha256)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-direct-apks
          path: |
            apps/android/app/build/outputs/apk/qualification-sha256
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
  android-direct:
    name: Android direct-relay device bench (${{ matrix.scenario }})
    needs: [build, android-direct-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [same-lan, udp-blocked, network-change]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNNER_TEMP: ${{ github.workspace }}/.qualification/tmp
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.qualification/tool-cache
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7c6dee0c42e92c9c79d385b16e71924328677043
      - name: Verify source and configure workspace paths
        run: |
          test "$(git rev-parse HEAD)" = 7c6dee0c42e92c9c79d385b16e71924328677043
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
          mkdir -p .qualification/{tmp,tool-cache,cargo,rustup,cache,npm,pnpm,gradle,android,android-home,playwright,apt/partial}
          echo "TMPDIR=$PWD/.qualification/tmp" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$PWD/.qualification/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.qualification/rustup" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$PWD/.qualification/cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.qualification/npm" >> "$GITHUB_ENV"
          echo "PNPM_HOME=$PWD/.qualification/pnpm" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$PWD/.qualification/pnpm/store" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.qualification/gradle" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PWD/.qualification/android" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$PWD/.qualification/android-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$PWD/.qualification/android-home/avd" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/.qualification/playwright" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: false
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" update -qq && sudo apt-get -o Dir::Cache::archives="$PWD/.qualification/apt" install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          path: .
      - run: (cd dist && sha256sum -c ../.qualification/browser-sha256)
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          path: target/debug/
      - run: (cd target/debug && sha256sum -c qualification-sha256)
      - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          path: apps/android/app/build/outputs/apk/
      - run: (cd apps/android/app/build/outputs/apk && sha256sum -c qualification-sha256)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-emulator
        with:
          build-packages: ''
      - name: Observe native responses, network restart and revocation
        env:
          ANDROID_SCENARIO: ${{ matrix.scenario }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            python3 tests/network-bench.py "$ANDROID_SCENARIO" --android --output "test-results/android-direct/$ANDROID_SCENARIO.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-direct-device-evidence-${{ matrix.scenario }}
          path: test-results/android-direct/
          retention-days: 14
