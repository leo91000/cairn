name: Temporary native Android abort diagnostic
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Single same-LAN diagnostic execution
        type: choice
        options: ['1']
        default: '1'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@127.0.0.1:5432/cairn_beacon_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Verify immutable binary inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=353ad3b6bce739abdabdee8acca2ce791a506286
          observed=$(gh api repos/leo91000/cairn/actions/runs/41085051808 --jq .head_sha)
          test "$observed" = "$source"
          git cat-file -e "$source^{commit}"
          git diff --exit-code "$source" HEAD -- Cargo.toml Cargo.lock crates vendor plugins apps packages tests/e2e scripts/android-direct-fixture.mjs scripts/test-environment.mjs .github/actions
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 iptables util-linux
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-build
          run-id: 41085051808
          repository: leo91000/cairn
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: dist/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: browser-backend
          run-id: 41085051808
          repository: leo91000/cairn
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: target/debug/
      - run: chmod +x target/debug/cairn target/debug/cairn-beacon target/debug/examples/browser_fixture target/debug/examples/network_direct_client target/debug/examples/network_stun_server
      - uses: actions/download-artifact@v8.0.1
        with:
          name: android-direct-apks
          run-id: 41085051808
          repository: leo91000/cairn
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: apps/android/app/build/outputs/apk/
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-emulator
        with:
          build-packages: ''
      - name: Reproduce same-LAN abort; fail on the first failing run
        timeout-minutes: 20
        env:
          STRESS_RUNS: ${{ inputs.repetitions }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            case "$STRESS_RUNS" in 1) ;; *) exit 2 ;; esac;
            python3 tests/network-bench.py same-lan --android --output "test-results/android-native-abort/same-lan-1.json" || exit "$?"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-native-abort-diagnostic
          path: test-results/android-native-abort/
          retention-days: 14
