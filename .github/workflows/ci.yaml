  qualification-result:
    runs-on: ubuntu-latest
    needs:
    - resolve
    - build
    - browser
    - network-bench
    - android-direct-build
    - android-direct
    if: always()
    timeout-minutes: 5
    steps:
    - name: Require every selected normal job to succeed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        node --input-type=module <<'JS'
        const expected = ['resolve', 'build', 'browser', 'network-bench', 'android-direct-build', 'android-direct'];
        const results = JSON.parse(process.env.RESULTS);
        if (Object.keys(results).length !== expected.length || expected.some(name => results[name]?.result !== 'success'))
          throw new Error('Every selected normal qualification job must succeed');
        console.log('All selected normal browser/network jobs succeeded; no release provenance.');
        JS
