name: Retained journal targeted qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_IMAGE: ghcr.io/leo91000/cairn@sha256:2622749b7e2da69f3ad37bc1bff288b32e140fc0bced6a9e50a426f447552e8d
      CAIRN_RETENTION_MEMORY_GIB: '4'
      CAIRN_RETENTION_TURNS: '4'
      CAIRN_RETENTION_CRASH_AFTER: '2'
      CAIRN_RETENTION_ADMISSION: 'true'
      CAIRN_RETENTION_PUBLISH: 'true'
      CAIRN_RETENTION_ASYNC_PUBLISH: 'true'
      CAIRN_VM_RETENTION_SECONDS: '180'
      CAIRN_RETENTION_CPU_QUOTA: '3'
      VM_TEST_ROOT: /r
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4a18d2307c98e616a0af64749d66998772d4c03d
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Verify immutable image inputs and updated test source
        run: |
          mkdir -p retention-evidence
          python3 - <<'PYVERIFY'
          import hashlib, json, os, shlex, subprocess
          from pathlib import Path
          reference = 'ed6d1f81e213dc868546471e16ab2e9a4437fac5'
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = {'Dockerfile', '.dockerignore'}
          for line in Path('Dockerfile').read_text().splitlines():
              if not line.startswith('COPY ') or '--from=' in line:
                  continue
              tokens = [token for token in shlex.split(line)[1:] if not token.startswith('--')]
              paths.update(tokens[:-1])
          rows = []
          for sha in (reference, source):
              data = subprocess.check_output(['git', 'ls-tree', '-rz', sha, '--', *sorted(paths)])
              rows.append(dict(source=sha, sha256=hashlib.sha256(data).hexdigest(), entries=len(data.split(b'\0')) - 1))
          assert rows[0]['sha256'] == rows[1]['sha256'] == 'bfe97146f0286974f16849f300d81ddeb0e7fab36f5af431b0c5d3f025f0b072'
          blob = subprocess.check_output(['git', 'rev-parse', 'HEAD:tests/runner-retention-smoke.mjs'], text=True).strip()
          assert blob == 'f547473213b8544bea772b8db71de5685a4d40de'
          evidence = dict(image=os.environ['SMOKE_IMAGE'], qualifiedRun=40715586054, source=source, testBlob=blob, inputComparisons=rows, paths=sorted(paths), originalImageCommit=reference)
          Path('retention-evidence/inputs.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PYVERIFY
          node --check tests/runner-retention-smoke.mjs
      - name: Prepare disposable KVM and ublk host
        run: |
          test -c /dev/kvm
          if ! sudo modprobe ublk_drv; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe ublk_drv
          fi
          test -c /dev/ublk-control
          test "$(cat /proc/sys/kernel/io_uring_disabled)" = 0
          if grep -qw vmx /proc/cpuinfo; then
            grep -Eq '^(Y|1)$' /sys/module/kvm_intel/parameters/nested
          else
            grep -qw svm /proc/cpuinfo
            grep -Eq '^(Y|1)$' /sys/module/kvm_amd/parameters/nested
          fi
          sudo modprobe zram num_devices=1
          sudo swapoff -a
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm > /dev/null
          echo 4G | sudo tee /sys/block/zram0/disksize > /dev/null
          sudo mkswap /dev/zram0
          sudo swapon --priority 100 /dev/zram0
          mkdir -p "$HOME/.cache/cairn-retention"
          sudo mkdir /r
          sudo mount --bind "$HOME/.cache/cairn-retention" /r
          uname -a | tee retention-evidence/host.txt
          lscpu >> retention-evidence/host.txt
          free -b >> retention-evidence/host.txt
          swapon --show >> retention-evidence/host.txt
          df -h / >> retention-evidence/host.txt
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the previously qualified immutable image
        run: |
          docker pull "$SMOKE_IMAGE"
          docker image inspect "$SMOKE_IMAGE" --format '{{json .RepoDigests}}' | tee retention-evidence/digest.json
          docker run --rm --entrypoint /usr/local/bin/node "$SMOKE_IMAGE" -e 'console.log(JSON.stringify({commit:process.env.APP_COMMIT,runtime:process.env.APP_RUNTIME_ID,codex:process.env.APP_CODEX_VERSION,claude:process.env.APP_CLAUDE_VERSION,opencode:process.env.APP_OPENCODE_VERSION,gh:process.env.APP_GH_VERSION}))' | tee retention-evidence/image-metadata.json
      - name: Run updated retained-journal qualification
        run: |
          set -o pipefail
          node tests/runner-retention-smoke.mjs "$SMOKE_IMAGE" 2>&1 | tee retention-evidence/retention.log
      - name: Remove the temporary path binding
        if: always()
        run: |
          if mountpoint -q /r; then
            sudo umount /r
          fi
          if test -d /r; then
            sudo rmdir /r
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: retained-journal-targeted-evidence
          path: retention-evidence/
          retention-days: 14
