name: Node-only pinned b4 diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: node-only-b4-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  node-checks:
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cairn_beacon_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cairn -d cairn_beacon_test" --health-interval 5s --health-timeout 5s --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CAIRN_BEACON_TEST_DATABASE_URL: postgres://cairn:test-only@localhost:5432/cairn_beacon_test
    steps:
    - name: Initialize bounded diagnostic capture after original service initialization
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: |
        mkdir -p "$RUNNER_TEMP/node-diagnostic"
        cat > "$RUNNER_TEMP/node-diagnostic/snapshot.sh" <<'DIAG_SCRIPT'
        #!/usr/bin/env bash
        set -u
        stage="$1"
        evidence="$RUNNER_TEMP/node-diagnostic"
        {
          date --utc --iso-8601=seconds
          printf 'stage=%s\n' "$stage"
          printf 'source=%s\nworkflow=%s\n' 'b4f27cfd9ce9645a823261c70254b657ad0d42a2' "$WORKFLOW_REVISION"
          uname -sr
          for path in / "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            printf '\nfilesystem=%s\n' "$path"
            df -B1 --output=source,fstype,size,used,avail,pcent,target "$path"
            df --output=source,itotal,iused,iavail,ipcent,target "$path"
            findmnt --target "$path" --output SOURCE,FSTYPE,SIZE,USED,AVAIL,TARGET
          done
          for path in "$GITHUB_WORKSPACE/target/debug" "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.rustup" "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP" /var/lib/docker /var/cache/apt/archives; do
            if test -d "$path"; then
              printf '\ndirectory=%s\n' "$path"
              timeout 8s sudo -n du -x -s -B1 "$path"
              printf 'du_exit=%s\n' "$?"
            fi
          done
          tail -n 3 "$evidence/filesystem-samples.jsonl" 2>/dev/null || true
        } 2>&1 | tee "$evidence/$stage.txt"
        exit 0
        DIAG_SCRIPT
        cat > "$RUNNER_TEMP/node-diagnostic/sample.py" <<'DIAG_SCRIPT'
        import datetime
        import json
        import os
        import time

        paths = ['/', os.environ['RUNNER_TEMP'], os.environ['GITHUB_WORKSPACE']]
        for _ in range(180):
            row = {'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'filesystems': []}
            for path in paths:
                try:
                    stat = os.statvfs(path)
                    row['filesystems'].append(dict(path=path, total_bytes=stat.f_blocks*stat.f_frsize,
                        available_bytes=stat.f_bavail*stat.f_frsize, free_inodes=stat.f_favail))
                except OSError as error:
                    row['filesystems'].append(dict(path=path, errno=error.errno))
            print(json.dumps(row), flush=True)
            time.sleep(15)
        DIAG_SCRIPT
        cat > "$RUNNER_TEMP/node-diagnostic/cache-metadata.py" <<'DIAG_SCRIPT'
        import datetime
        import json
        import os
        import pathlib
        import urllib.error
        import urllib.parse
        import urllib.request

        query = urllib.parse.urlencode({'key': os.environ['CACHE_LOOKUP_PREFIX'], 'per_page': 100})
        url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/caches?{query}"
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
            'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
        result = {'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'prefix': os.environ['CACHE_LOOKUP_PREFIX'], 'page_limit': 100}
        try:
            with urllib.request.urlopen(request, timeout=20) as response:
                data = json.load(response)
                result['total_count'] = data['total_count']
                result['truncated'] = len(data['actions_caches']) < data['total_count']
                fields = ['id', 'key', 'ref', 'size_in_bytes', 'version', 'created_at', 'last_accessed_at']
                result['caches'] = [{key: entry.get(key) for key in fields} for entry in data['actions_caches']]
        except urllib.error.HTTPError as error:
            result['http_status'] = error.code
            result['request_id'] = error.headers.get('X-GitHub-Request-Id')
        except (OSError, ValueError) as error:
            result['error_type'] = type(error).__name__
        path = pathlib.Path(os.environ['RUNNER_TEMP'])/'node-diagnostic'/os.environ['CACHE_METADATA_FILE']
        path.write_text(json.dumps(result, indent=2)+'\n')
        print(json.dumps(result))
        DIAG_SCRIPT
        python3 - <<'PY'
        import json,os,pathlib
        names = ['RUNNER_OS','RUNNER_ARCH','RUNNER_NAME','ImageOS','ImageVersion','GITHUB_SHA','GITHUB_WORKFLOW_REF','GITHUB_WORKFLOW_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']
        p = pathlib.Path(os.environ['RUNNER_TEMP'])/'node-diagnostic'/'runner.json'
        p.write_text(json.dumps({name:os.environ.get(name) for name in names},indent=2)+'\n')
        print(p.read_text())
        PY
        nohup python3 -u "$RUNNER_TEMP/node-diagnostic/sample.py" > "$RUNNER_TEMP/node-diagnostic/filesystem-samples.jsonl" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/node-diagnostic/sampler.pid"
        bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-services
    - uses: actions/checkout@v7.0.1
      with:
        ref: b4f27cfd9ce9645a823261c70254b657ad0d42a2
    - name: Verify exact tested source and tree
      run: |
        test "$(git rev-parse HEAD)" = b4f27cfd9ce9645a823261c70254b657ad0d42a2
        test "$(git rev-parse HEAD^{tree})" = 9ba09bb74ec4393b018cf64b289fe27f3a45b5f8
        git diff --exit-code
        git diff --cached --exit-code
    - name: 'Diagnostic snapshot: after-checkout'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-checkout
    - uses: ./.github/actions/setup-pnpm
      with:
        cache: true
      id: pnpm
    - name: 'Diagnostic snapshot: after-pnpm'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-pnpm
    - run: |-
        rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      id: rust
    - name: 'Diagnostic snapshot: after-rust'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-rust
    - name: Install native test dependencies
      run: |-
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev age e2fsprogs fakeroot
      id: apt
    - name: 'Diagnostic snapshot: after-apt'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-apt
    - id: key
      shell: bash
      env:
        CACHE_PREFIX: rust-v3-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
        CACHE_REVISION: b4f27cfd9ce9645a823261c70254b657ad0d42a2
      run: |
        echo "primary=$CACHE_PREFIX-$CACHE_REVISION" >> "$GITHUB_OUTPUT"
        echo "fallback=$CACHE_PREFIX-" >> "$GITHUB_OUTPUT"
    - name: Record available archive metadata before original cache restore
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_LOOKUP_PREFIX: ${{ steps.key.outputs.fallback }}
        CACHE_METADATA_FILE: cache-before.json
      run: python3 "$RUNNER_TEMP/node-diagnostic/cache-metadata.py"
    - id: reader
      uses: actions/cache/restore@v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/
          target/debug/
          !target/debug/incremental/
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.fallback }}
          rust-v3-${{ runner.os }}-1.97.1-debug0-
    - name: 'Diagnostic snapshot: after-reader'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-reader
    - id: bootstrap
      shell: bash
      run: |
        if [[ ! -d target/debug/deps ]]; then
          echo 'needed=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Bootstrap from the previous cache format
      if: steps.bootstrap.outputs.needed == 'true'
      uses: actions/cache/restore@v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: rust-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-1.97.1-debug0-
      id: legacy
    - name: Record actual cache action outputs
      if: always()
      env:
        PRIMARY: ${{ steps.reader.outputs.cache-primary-key }}
        MATCHED: ${{ steps.reader.outputs.cache-matched-key }}
        HIT: ${{ steps.reader.outputs.cache-hit }}
        LEGACY_MATCHED: ${{ steps.legacy.outputs.cache-matched-key }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib
        result = {name:os.environ.get(name) for name in ['PRIMARY','MATCHED','HIT','LEGACY_MATCHED']}
        p = pathlib.Path(os.environ['RUNNER_TEMP'])/'node-diagnostic'/'cache-outputs.json'
        p.write_text(json.dumps(result,indent=2)+'\n')
        print(p.read_text())
        PY
    - name: 'Diagnostic snapshot: after-cache'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-cache
    - name: Prepare the installation host's required ublk driver
      run: |
        if ! sudo modprobe ublk_drv; then
          sudo apt-get update -qq
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe ublk_drv
        fi
        test -c /dev/ublk-control
      id: ublk
    - name: 'Diagnostic snapshot: after-ublk'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-ublk
    - name: Build the frontend used by installer and update fixtures
      run: |-
        pnpm exec vite build --config apps/web/vite.config.ts
      id: frontend
    - name: 'Diagnostic snapshot: after-frontend'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-frontend
    - name: Validate node supervisor and S3 recovery
      run: |
        python3 scripts/tests/guest_trim_test.py
        python3 scripts/tests/guest_projects_test.py
        python3 scripts/tests/node_supervisor_test.py
        python3 deploy/nodes/test_native_host.py
        bash -n deploy/nodes/native-install.sh
        python3 scripts/tests/installation_installer_test.py
        python3 scripts/tests/compressed_swap_test.py
        python3 scripts/tests/installation_updates_test.py
        python3 scripts/tests/production_release_test.py
        bash tests/installation-installer-container.sh
        python3 tests/installation_update_containers.py
        python3 -m venv .node-s3-test
        .node-s3-test/bin/pip install 'moto[server]==5.2.3' awscli blake3==1.0.8
        .node-s3-test/bin/python scripts/tests/storage_observer_test.py
        .node-s3-test/bin/python scripts/tests/storage_sample_test.py
        PATH="$PWD/.node-s3-test/bin:$PATH" .node-s3-test/bin/python scripts/tests/node_s3_test.py
      id: qualification
    - name: 'Diagnostic snapshot: after-qualification'
      if: always()
      env:
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" after-qualification
    - name: Finalize bounded capture without exporting credentials
      if: always()
      env:
        QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        WORKFLOW_REVISION: ${{ github.workflow_sha }}
      run: |
        if test -f "$RUNNER_TEMP/node-diagnostic/sampler.pid"; then
          kill "$(cat "$RUNNER_TEMP/node-diagnostic/sampler.pid")" 2>/dev/null || true
        fi
        bash "$RUNNER_TEMP/node-diagnostic/snapshot.sh" final
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'node-diagnostic'/'result.json'
        p.write_text(json.dumps({'workflow_revision':os.environ['WORKFLOW_REVISION'],
            'source':'b4f27cfd9ce9645a823261c70254b657ad0d42a2',
            'source_tree':'9ba09bb74ec4393b018cf64b289fe27f3a45b5f8',
            'qualification_outcome':os.environ['QUALIFICATION_OUTCOME']},indent=2)+'\n')
        print(p.read_text())
        PY
    - name: Retain bounded nonsecret diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: node-only-diagnostic-b4-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/node-diagnostic/*.json
          ${{ runner.temp }}/node-diagnostic/*.jsonl
          ${{ runner.temp }}/node-diagnostic/*.txt
        retention-days: 7
        if-no-files-found: error
