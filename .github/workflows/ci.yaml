          SERVED_CLAUDE: ${{ needs.resolve.outputs.served-claude }}
          SERVED_OPENCODE: ${{ needs.resolve.outputs.served-opencode }}
          CLAUDE_VERSION: ${{ needs.resolve.outputs.claude }}
          OPENCODE_VERSION: ${{ needs.resolve.outputs.opencode }}
        run: node scripts/served-tools.mjs verify-served
      - name: Deploy the published image and verify the running commit
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.CAIRN_RELEASE_COOLIFY_TOKEN }}
          CAIRN_BEACON_ORIGIN: ${{ vars.CAIRN_BEACON_ORIGIN }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository_owner }}/cairn-beacon@${{ needs.resolve.outputs.beacon-digest || needs.beacon-image.outputs.digest }}
          DEPLOY_INSTALLATION_IMAGE: ghcr.io/${{ github.repository_owner }}/cairn@${{ needs.resolve.outputs.digest || needs.image.outputs.digest }}
          # A reused image reports the commit it was validated at, with this tag's tree.
          DEPLOY_COMMIT: ${{ needs.resolve.outputs.commit }}
