name: Recovery Rust qualification only
on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact source commit to qualify
        required: true
        type: string
permissions:
  contents: read
jobs:
  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libclang-dev age e2fsprogs fakeroot
      - uses: ./.github/actions/cache-rust
      - name: Check all Rust targets, including the required ublk transport
        run: pnpm validate:pr rust
