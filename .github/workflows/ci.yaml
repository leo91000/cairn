# One instrumented acquisition attempt; no compilation and no full qualification claim.
name: Nextest response diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  response-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: dacb93120f2aaf980a5061e29f0ca9a38110300c
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact source and make one instrumented acquisition attempt
        timeout-minutes: 3
        run: |
          test "$(git rev-parse HEAD)" = dacb93120f2aaf980a5061e29f0ca9a38110300c
          test "$(git rev-parse 'HEAD^{tree}')" = 98a32a0c16d4b432a6fc161f78fbdce66491406c
          git diff --exit-code
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import path from 'node:path'
          import { installNextest } from './scripts/install-nextest-ci.mjs'
          const record = value => {
            appendFileSync('nextest-response.jsonl', JSON.stringify(value) + '\n')
            console.log(JSON.stringify(value))
          }
          record({ source: 'dacb93120f2aaf980a5061e29f0ca9a38110300c', tree: '98a32a0c16d4b432a6fc161f78fbdce66491406c', fullQualification: false, automaticRetry: false })
          let requests = 0
          try {
            const result = await installNextest(path.join(process.env.CARGO_HOME || path.join(process.env.HOME, '.cargo'), 'bin'), {
              fetchAsset: async (url, options) => {
                const stage = requests++ === 0 ? 'api' : 'asset'
                const started = performance.now()
                const response = await fetch(url, options)
                const contentType = (response.headers.get('content-type') || '').split(';')[0].trim().toLowerCase()
                const headers = {}
                for (const key of ['content-length', 'x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-reset', 'retry-after']) {
                  const value = response.headers.get(key)
                  headers[key] = value && /^\d{1,16}$/.test(value) ? value : null
                }
                let redirect = 'absent'
                if (response.headers.has('location')) {
                  try {
                    const destination = new URL(response.headers.get('location'))
                    redirect = destination.protocol === 'https:' && destination.hostname === 'release-assets.githubusercontent.com' ? 'official-release-assets' : 'other'
                  } catch { redirect = 'invalid' }
                }
                record({ stage, status: response.status, contentType: ['application/octet-stream', 'application/json', 'text/html', 'text/plain'].includes(contentType) ? contentType : 'other-or-missing', redirect, elapsedMs: Math.round(performance.now() - started), headers })
                return response
              },
            })
            record({ acquisition: 'verified', ...result, requests, fullQualification: false })
          } catch (error) {
            record({ acquisition: 'failed', code: /^CI_NEXTEST_[A-Z_]+$/.test(error.message) ? error.message : 'UNCLASSIFIED', requests, fullQualification: false })
            process.exitCode = 1
          }
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nextest-response-diagnostic
          path: nextest-response.jsonl
          if-no-files-found: error
