        cat "$RUNNER_TEMP/browser-qualification-source/before.json"
    - uses: ./.github/actions/setup-pnpm
      with:
        cache: true
    - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
    - name: Prepare the native Android network toolchain
      run: node scripts/prepare-network-tools.mjs android-direct
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-build
        path: dist/
    - uses: actions/download-artifact@v8.0.1
      with:
        name: browser-backend
        path: target/debug/
    - run: chmod +x target/debug/examples/browser_fixture target/debug/cairn target/debug/cairn-beacon target/debug/examples/network_direct_client
        target/debug/examples/network_stun_server target/debug/examples/beacon_sql_fixture
    - uses: actions/download-artifact@v8.0.1
      with:
        name: android-direct-apks
        path: apps/android/app/build/outputs/apk/
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Reclaim unused Android SDK build packages
      run: node scripts/android-emulator-sdk.mjs prune
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: ./.github/actions/setup-android-emulator
      with:
        build-packages: build-tools;37.0.0 platforms;android-36
    - name: Check emulator userdata disk headroom
      run: node scripts/android-emulator-sdk.mjs preflight
    - name: Observe native responses, network restart and revocation
      env:
        ANDROID_SCENARIO: ${{ matrix.scenario }}
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        pre-emulator-launch-script: node scripts/android-emulator-sdk.mjs preflight
        script: if python3 tests/network-bench.py "$ANDROID_SCENARIO" --android --output "test-results/android-direct/$ANDROID_SCENARIO.json";
          then scenario_status=0; else scenario_status=$?; fi; node scripts/android-action-observer.mjs start test-results/android-direct/closure-observation
