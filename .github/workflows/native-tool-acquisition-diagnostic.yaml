name: Native tool acquisition diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch immutable source bindings without building
        run: git fetch --no-tags --depth=1 origin 272f4f3bbe5b276b0b9339cf38bab53b04bef8b2 ca526fc46e8aae81c0955a2dd6e116a9bac45d60 c7dc7fb78aeb9f50fdf0e8ed8295659dec6e9b93 c186d11e048cdcb8d2d1ae31a11a277a03411baf
      - name: Observe public acquisition with fixed request and byte bounds
        run: python3 scripts/native-tool-acquisition-diagnostic.py --output native-tool-acquisition-diagnostic.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-tool-acquisition-diagnostic
          path: native-tool-acquisition-diagnostic.json
          if-no-files-found: error
          retention-days: 14
