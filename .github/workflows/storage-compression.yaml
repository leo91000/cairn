name: Storage compression reference
on:
  pull_request:
    paths:
      - .github/workflows/storage-compression.yaml
      - Cargo.lock
      - crates/installation/Cargo.toml
      - 'crates/installation/src/storage/**'
      - crates/installation/src/nodes/publication.rs
      - crates/installation/src/nodes/shared_blocks.rs
      - crates/installation/src/service.rs
      - crates/installation/src/store.rs
      - crates/installation/src/main.rs
      - crates/installation/tests/storage_startup_migration.rs
      - crates/installation/src/object_storage.rs
      - crates/installation/tests/block_codec_performance.rs
      - crates/installation/tests/fixtures/block-codec-source.txt
      - scripts/tests/node_s3_test.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-compression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/release/
            !target/release/incremental/
          key: storage-compression-v2-${{ runner.os }}-1.97.1-release-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            storage-compression-v2-${{ runner.os }}-1.97.1-release-${{ hashFiles('Cargo.lock') }}-
            storage-compression-v2-${{ runner.os }}-1.97.1-release-
            storage-compression-${{ runner.os }}-1.97.1-release-
      - name: Prepare isolated loopback S3
        run: |
          python3 -m venv .codec-s3-test
          .codec-s3-test/bin/pip install 'moto[server]==5.2.3'
      - name: Measure encoding, upload and cold/warm reads against raw reference
        run: |
          set -o pipefail
          .codec-s3-test/bin/python scripts/tests/node_s3_test.py --compression-benchmark 2>&1 | tee storage-compression.log
      - name: Save results and comparison
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          lines = pathlib.Path('storage-compression.log').read_text().splitlines()
          rows = [json.loads(line.split('BLOCK_CODEC_PERF ', 1)[1]) for line in lines if 'BLOCK_CODEC_PERF ' in line]
          migration_rows = [json.loads(line.split('STORAGE_MIGRATION_PERF ', 1)[1]) for line in lines if 'STORAGE_MIGRATION_PERF ' in line]
          if len(migration_rows) != 3:
              raise SystemExit(f'Expected 3 startup migration rows, got {len(migration_rows)}')
          if len(rows) != 16:
              raise SystemExit(f'Expected 16 result rows, got {len(rows)}')
          output = {
              'commit': os.environ['GITHUB_SHA'],
              'platform': platform.platform(),
              'cpuCount': os.cpu_count(),
              'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'profile': 'release (repository settings)',
              'scope': 'Synthetic data, native codec and isolated loopback S3; no WAN or VM startup measurement.',
              'results': rows,
              'migrationResults': migration_rows,
          }
          pathlib.Path('storage-compression-reference.json').write_text(json.dumps(output, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Synthetic 4 MiB inputs; 16 alternating trials per policy after two warmups. No WAN or VM startup measurement.\n\n')
              summary.write('| Transport | Input | Format | Encoded bytes | Write p50 ms | Read p50 ms | Warm 4 KiB p50 ms |\n')
              summary.write('| --- | --- | --- | ---: | ---: | ---: | ---: |\n')
              for row in rows:
                  warm = row['warm4KiB']
                  warm_text = f"{warm['p50Ms']:.4f}" if warm else '—'
                  summary.write(f"| {row['transport']} | {row['case']} | {row['format']} | {row['encodedBytes']} | {row['write']['p50Ms']:.3f} | {row['read']['p50Ms']:.3f} | {warm_text} |\n")
              summary.write('\nBlocking manager startup for four old raw 4 MiB objects, including verified copy and old-key/version cleanup; no WAN or Moto CPU.\n\n')
              summary.write('| Trial | Old bytes | New bytes | Startup without migration ms | Startup with migration ms | Migration startup CPU ms |\n')
              summary.write('| ---: | ---: | ---: | ---: | ---: | ---: |\n')
              for row in migration_rows:
                  summary.write(f"| {row['trial']} | {row['oldEncodedBytes']} | {row['newEncodedBytes']} | {row['startupWithoutMigrationMs']:.3f} | {row['startupWithMigrationMs']:.3f} | {row['startupWithMigrationCpuMs']:.3f} |\n")
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: storage-compression-reference
          path: |
            storage-compression-reference.json
            storage-compression.log
          retention-days: 30
