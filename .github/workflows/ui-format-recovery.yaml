name: UI formatting recovery
on: workflow_dispatch
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: cd android && ./gradlew spotlessApply --no-daemon
      - run: git diff --binary > formatting.patch
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kotlin-formatting
          path: formatting.patch
