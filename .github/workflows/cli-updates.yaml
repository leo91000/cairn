name: Update agent tools
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: cli-updates
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      base_image: ${{ steps.check.outputs.base_image }}
      commit: ${{ steps.check.outputs.commit }}
      codex: ${{ steps.check.outputs.codex }}
      gh: ${{ steps.check.outputs.gh }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: node scripts/cli-updates.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          LEO_PUBLIC_URL: ${{ vars.LEO_PUBLIC_URL }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-update-plan
          path: cli-update-plan.json
          retention-days: 30
  image:
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: leo_official_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leo -d leo_official_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cli-update-plan
      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: .
          file: Dockerfile.cli-update
          push: true
          tags: ghcr.io/${{ github.repository }}:cli-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BASE_IMAGE=${{ needs.check.outputs.base_image }}
            CODEX_VERSION=${{ needs.check.outputs.codex }}
            GH_VERSION=${{ needs.check.outputs.gh }}
            UPDATE_ID=cli-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: github_token=${{ github.token }}
          provenance: mode=max
          sbom: true
      # CLI updates preserve the application binary: test its exact source,
      # including the local-login smoke contract of pre-relay images.
      - name: Check out the deployed application for its smoke tests
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - name: Build official smoke prerequisites when present
        run: |
          if test -f official-service/Cargo.toml; then
            rustup toolchain install --profile minimal "$(sed -n 's/channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
            pnpm build
            cargo build --locked --bin leo-official
          fi
      - name: Verify the candidate image before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          SMOKE_COMMIT: ${{ needs.check.outputs.commit }}
          LEO_OFFICIAL_TEST_DATABASE_URL: postgres://leo:test-only@127.0.0.1:5432/leo_official_test
        run: |
          node tests/container-smoke.mjs "$SMOKE_IMAGE"
          node tests/runner-smoke.mjs "$SMOKE_IMAGE"
          LEO_RETENTION_MEMORY_GIB=4 node tests/runner-retention-smoke.mjs "$SMOKE_IMAGE"
  deploy:
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    concurrency:
      group: coolify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cli-update-plan
      - name: Restart with recovery, verify runtime, and roll back on failure
        run: node scripts/cli-updates.mjs deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          LEO_PUBLIC_URL: ${{ vars.LEO_PUBLIC_URL }}
          LEO_MAINTENANCE_TOKEN: ${{ secrets.LEO_MAINTENANCE_TOKEN }}
          UPDATE_ID: cli-${{ github.run_id }}-${{ github.run_attempt }}
          UPDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
