name: Cache compiled Rust targets
description: Share one Rust cache, refreshed by the backend test job after source changes.
inputs:
  save:
    description: Whether this job owns cache publication.
    default: 'false'
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        CACHE_PREFIX: rust-v3-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
        CACHE_REVISION: ${{ github.sha }}
      run: |
        echo "primary=$CACHE_PREFIX-$CACHE_REVISION" >> "$GITHUB_OUTPUT"
        echo "fallback=$CACHE_PREFIX-" >> "$GITHUB_OUTPUT"
    # Upload the small preflight before restore so a worker disk failure cannot
    # erase the only capacity evidence. Observers never change cache policy.
    - name: Observe capacity before restoring Rust cache
      continue-on-error: true
      shell: bash
      run: node scripts/ci-rust-cache-observation.mjs before-restore "$RUNNER_TEMP/cairn-cache-observation/before-restore.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: rust-cache-before-restore-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cairn-cache-observation/before-restore.json
        retention-days: 14
    - id: writer
      uses: actions/cache@v6.1.0
      if: inputs.save == 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/
          target/debug/
          !target/debug/incremental/
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.fallback }}
          rust-v3-${{ runner.os }}-1.97.1-debug0-
    - id: reader
      uses: actions/cache/restore@v6.1.0
      if: inputs.save != 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/
          target/debug/
          !target/debug/incremental/
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.fallback }}
          rust-v3-${{ runner.os }}-1.97.1-debug0-
    # Seed the new format once from main's previous cache rather than making
    # every workload compile its full dependency graph during migration.
    - id: bootstrap
      shell: bash
      run: |
        if [[ ! -d target/debug/deps ]]; then
          echo 'needed=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Bootstrap from the previous cache format
      if: steps.bootstrap.outputs.needed == 'true'
      uses: actions/cache/restore@v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: rust-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-1.97.1-debug0-
    - name: Observe capacity after restoring Rust cache
      if: always()
      continue-on-error: true
      shell: bash
      run: node scripts/ci-rust-cache-observation.mjs after-restore "$RUNNER_TEMP/cairn-cache-observation/after-restore.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: rust-cache-after-restore-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cairn-cache-observation/after-restore.json
        retention-days: 14
