name: Cache compiled Rust targets
description: Share one Rust cache, refreshed by the backend test job after source changes.
inputs:
  save:
    description: Whether this job owns cache publication.
    default: 'false'
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        CACHE_PREFIX: rust-v3-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
        CACHE_REVISION: ${{ github.sha }}
      run: |
        echo "primary=$CACHE_PREFIX-$CACHE_REVISION" >> "$GITHUB_OUTPUT"
        echo "fallback=$CACHE_PREFIX-" >> "$GITHUB_OUTPUT"
    - id: writer
      uses: actions/cache@v6.1.0
      if: inputs.save == 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/
          target/debug/
          !target/debug/incremental/
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.fallback }}
          rust-v3-${{ runner.os }}-1.97.1-debug0-
    - id: reader
      uses: actions/cache/restore@v6.1.0
      if: inputs.save != 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/
          target/debug/
          !target/debug/incremental/
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.fallback }}
          rust-v3-${{ runner.os }}-1.97.1-debug0-
    # Seed the new format once from main's previous cache rather than making
    # every workload compile its full dependency graph during migration.
    - id: bootstrap
      shell: bash
      run: |
        if [[ ! -d target/debug/deps ]]; then
          echo 'needed=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Bootstrap from the previous cache format
      if: steps.bootstrap.outputs.needed == 'true'
      uses: actions/cache/restore@v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: rust-${{ runner.os }}-1.97.1-debug0-${{ hashFiles('Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-1.97.1-debug0-
