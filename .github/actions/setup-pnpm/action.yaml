name: Set up pnpm and Node
description: Use cached Node 24 and retry pnpm bootstrap once when the registry is unavailable.
inputs:
  install:
    description: Install dependencies from the lockfile.
    default: 'true'
  cache:
    description: Cache the pnpm store.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - id: setup
      uses: pnpm/setup@v2.1.0
      continue-on-error: true
      with:
        require-lockfile: true
        install: ${{ inputs.install }}
        cache: ${{ inputs.cache }}
    - name: Retry bootstrap
      if: steps.setup.outcome == 'failure'
      uses: pnpm/setup@v2.1.0
      with:
        require-lockfile: true
        install: ${{ inputs.install }}
        cache: ${{ inputs.cache }}
