name: Observe Rust build capacity
description: Record bounded build directory and filesystem capacity aggregates without caching.
inputs:
  phase:
    description: before-build or after-build
    required: true
runs:
  using: composite
  steps:
    - name: Observe Rust build capacity
      continue-on-error: true
      shell: bash
      env:
        OBSERVATION_PHASE: ${{ inputs.phase }}
      run: node scripts/ci-rust-build-observation.mjs "$OBSERVATION_PHASE" "$RUNNER_TEMP/cairn-rust-observation/$OBSERVATION_PHASE.json"
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: rust-build-${{ inputs.phase }}-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cairn-rust-observation/${{ inputs.phase }}.json
        retention-days: 14
