name: Ensure ublk kernel driver
description: Load ublk_drv (installing linux-modules-extra if missing) and verify /dev/ublk-control.
inputs:
  update-apt:
    description: Run apt-get update before installing linux-modules-extra if modprobe fails.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Load ublk_drv and verify /dev/ublk-control
      shell: bash
      env:
        UPDATE_APT: ${{ inputs.update-apt }}
      run: |
        if ! sudo modprobe ublk_drv; then
          if [[ "$UPDATE_APT" == true ]]; then
            sudo apt-get update -qq
          fi
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe ublk_drv
        fi
        test -c /dev/ublk-control
