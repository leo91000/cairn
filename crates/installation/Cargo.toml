[package]
name = "cairn-installation"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[features]
# Built only into the disposable worker test fixture by the backend launcher.
worker-fixture-hooks = []

[[bin]]
name = "cairn"
path = "src/main.rs"

[[example]]
name = "native_storage_qualifier"

[dependencies]
cairn-block-storage = { workspace = true }
cairn-code-mode = { workspace = true }
cairn-contracts = { workspace = true }
cairn-protocol = { workspace = true }
cairn-plugin-api = { workspace = true }
cairn-plugin-host = { workspace = true }
cairn-plugin-runtime = { workspace = true }
cairn-rules-eval = { workspace = true }
axum = { workspace = true, features = [
  "macros",
  "form"
] }
tokio = { workspace = true, features = [ "full" ] }
tokio-util = { workspace = true, features = [
  "rt",
  "io"
] }
tower-http = { workspace = true, features = [
  "fs",
  "compression-br",
  "compression-gzip",
  "trace"
] }
serde = { workspace = true }
serde_json = { workspace = true, features = [ "raw_value" ] }
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
jsonschema = { version = "0.56", default-features = false }
rusqlite = { version = "0.40", features = [
  "bundled",
  "functions",
  "serde_json"
] }
rustls = { workspace = true, features = [ "aws_lc_rs" ] }
reqwest = { workspace = true, features = [
  "json",
  "stream",
  "rustls"
] }
futures-util = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true, features = [
  "client",
  "http1",
  "server"
] }
hyper-util = { workspace = true, features = [
  "service",
  "tokio"
] }
bytes = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = [
  "v4",
  "serde"
] }
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
aes-gcm = "0.10"
hex = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
chrono = { version = "0.4", features = [ "serde" ] }
chrono-tz = "0.10"
croner = "4"
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "json"
] }
tokio-vsock = "0.7.2"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp"
] }
async-trait = { workspace = true }
blake3 = "1.8.7"
flate2 = { workspace = true }
lru = "0.18.5"
tokio-tungstenite = { workspace = true, features = [ "rustls-tls-webpki-roots" ] }
tower = { workspace = true, features = [ "util" ] }
webrtc = { workspace = true, features = [
  "runtime-tokio",
  "crypto-aws-lc-rs"
] }
rtc = { workspace = true, features = [ "crypto-aws-lc-rs" ] }
rcgen = { version = "0.14", default-features = false, features = [ "aws_lc_rs" ] }
tokio-rustls = { workspace = true, features = [ "aws_lc_rs" ] }
zip = { version = "6", default-features = false, features = [ "deflate-flate2" ] }
mail-builder = { version = "=0.4.4", default-features = false }
mime_guess = "=2.0.5"
toml = { workspace = true }
toml_edit = { version = "0.25", features = [ "serde" ] }
jsonc-parser = { version = "0.34", features = [
  "cst",
  "serde"
] }

[dev-dependencies]
tracing-core = "0.1"
tokio = { workspace = true, features = [ "test-util" ] }

[lints]
workspace = true
