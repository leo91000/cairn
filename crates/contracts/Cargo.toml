[package]
name = "cairn-contracts"
version = "0.52.3"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
schemars = { version = "=1.2.3", features = [ "uuid1" ] }
ts-rs = { version = "=12.0.1", features = [ "uuid-impl" ] }
uuid = { version = "1", features = [
  "serde",
  "v4"
] }
