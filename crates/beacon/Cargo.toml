[package]
name = "cairn-beacon"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "cairn-beacon"
path = "src/main.rs"

[dependencies]
cairn-contracts = { workspace = true }
cairn-protocol = { workspace = true }
axum = { workspace = true, features = [ "ws" ] }
tokio = { workspace = true, features = [ "full" ] }
tower-http = { workspace = true, features = [
  "fs",
  "set-header"
] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx-core = { version = "=0.8.6", features = [
  "_rt-tokio",
  "_tls-rustls-ring-webpki",
  "migrate"
] }
sqlx-postgres = { version = "=0.8.6", features = [ "migrate" ] }
sqlx-macros = { version = "=0.8.6", default-features = false, features = [
  "migrate",
  "postgres"
] }
ipnet = "2"
async-trait = { workspace = true }
rustls = { workspace = true, features = [ "aws_lc_rs" ] }
reqwest = { workspace = true, features = [
  "json",
  "form",
  "rustls"
] }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
email_address = "0.2"
subtle = { workspace = true }
uuid = { workspace = true, features = [ "v4" ] }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }
webauthn-rs = { version = "0.5.4", features = [
  "danger-allow-state-serialisation",
  "conditional-ui"
] }
webauthn-rs-proto = "0.5.4"
base64 = { workspace = true }
futures-util = { workspace = true }
web-push = { version = "0.11", default-features = false, features = [ "hyper-client" ] }
p256 = { version = "0.13", features = [ "pem" ] }
jwt-simple = { version = "=0.12.17", default-features = false, features = [ "pure-rust" ] }
ring = { workspace = true }
crc32fast = "=1.5.1"

[dev-dependencies]
flate2 = { workspace = true }
libc = { workspace = true }
rtc = { workspace = true, features = [ "crypto-aws-lc-rs" ] }
tokio-tungstenite = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.4", features = [ "softpasskey" ] }
cairn-installation = { workspace = true }
cairn-node-gateway = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true, features = [ "rt" ] }
webrtc = { workspace = true, features = [
  "runtime-tokio",
  "crypto-aws-lc-rs"
] }
bytes = { workspace = true }

[lints]
workspace = true
