[package]
name = "cairn-beacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "cairn-beacon"
path = "src/main.rs"

[dependencies]
cairn-protocol = { path = "../protocol" }
axum = { version = "0.8.9", features = [ "ws" ] }
tokio = { version = "1", features = [ "full" ] }
tower-http = { version = "0.6", features = [
  "fs",
  "set-header"
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sqlx-core = { version = "=0.8.6", features = [
  "_rt-tokio",
  "_tls-rustls-ring-webpki",
  "migrate"
] }
sqlx-postgres = { version = "=0.8.6", features = [ "migrate" ] }
sqlx-macros = { version = "=0.8.6", default-features = false, features = [
  "migrate",
  "postgres"
] }
ipnet = "2"
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "rustls"
] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
email_address = "0.2"
subtle = "2"
uuid = { version = "1", features = [ "v4" ] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
webauthn-rs = { version = "0.5.4", features = [
  "danger-allow-state-serialisation",
  "conditional-ui"
] }
webauthn-rs-proto = "0.5.4"
base64 = "0.22"
futures-util = "0.3"
web-push = { version = "0.11", default-features = false, features = [ "hyper-client" ] }
p256 = { version = "0.13", features = [ "pem" ] }
jwt-simple = { version = "=0.12.17", default-features = false, features = [ "pure-rust" ] }
ring = "0.17"
crc32fast = "=1.5.1"

[dev-dependencies]
rtc = { version = "=0.21.0", default-features = false, features = [ "crypto-aws-lc-rs" ] }
tokio-tungstenite = "0.29"
webauthn-authenticator-rs = { version = "0.5.4", features = [ "softpasskey" ] }
cairn-installation = { path = "../installation" }
tempfile = "3"
tokio-util = { version = "0.7", features = [ "rt" ] }
webrtc = { version = "=0.21.0", default-features = false, features = [
  "runtime-tokio",
  "crypto-aws-lc-rs"
] }
bytes = "1"
