[package]
name = "cairn-node-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "cairn-node-gateway"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
bytes = "1"
cairn-protocol = { path = "../protocol" }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls"
] }
rtc = { version = "=0.21.0", default-features = false, features = [ "crypto-aws-lc-rs" ] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std"
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
tokio-rustls = { version = "0.26", default-features = false, features = [ "aws_lc_rs" ] }
tokio-tungstenite = { version = "0.29", features = [ "rustls-tls-webpki-roots" ] }
tokio-util = { version = "0.7", features = [ "rt" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
url = "2"
webrtc = { version = "=0.21.0", default-features = false, features = [
  "runtime-tokio",
  "crypto-aws-lc-rs"
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [ "test-util" ] }

[lints.clippy]
default_trait_access = "warn"
ignored_unit_patterns = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
