[package]
name = "cairn-node-gateway"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "cairn-node-gateway"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
cairn-protocol = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true, features = [
  "client",
  "server",
  "http1"
] }
hyper-util = { workspace = true, features = [ "tokio" ] }
reqwest = { workspace = true, features = [
  "json",
  "rustls"
] }
rtc = { workspace = true, features = [ "crypto-aws-lc-rs" ] }
rustls = { workspace = true, features = [
  "aws_lc_rs",
  "std"
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "full" ] }
tokio-rustls = { workspace = true, features = [ "aws_lc_rs" ] }
tokio-tungstenite = { workspace = true, features = [ "rustls-tls-webpki-roots" ] }
tokio-util = { workspace = true, features = [ "rt" ] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }
url = { workspace = true }
webrtc = { workspace = true, features = [
  "runtime-tokio",
  "crypto-aws-lc-rs"
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "test-util" ] }

[lints]
workspace = true
