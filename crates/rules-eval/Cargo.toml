[package]
name = "cairn-rules-eval"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[dependencies]
cairn-contracts = { workspace = true }
# Rule formulas (ADR-0075). Only the CEL standard library, strings and lists extensions.
cel = { version = "0.15", default-features = false, features = [
  "regex",
  "chrono",
  "json"
] }
chrono = { version = "0.4", features = [ "serde" ] }
chrono-tz = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
