services:
  manager:
    image: ${CAIRN_IMAGE:-ghcr.io/leo91000/cairn:latest}
    build: .
    container_name: cairn-manager
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      CAIRN_NODE_IMAGE: ${CAIRN_IMAGE:-}
      # Private origin used by execution nodes and run-scoped MCP.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4310}
      CAIRN_BEACON_ORIGIN: ${CAIRN_BEACON_ORIGIN:-}
      CAIRN_INSTALLATION_CLAIM_CODE: ${CAIRN_INSTALLATION_CLAIM_CODE:-}
      CAIRN_INSTALLATION_NAME: ${CAIRN_INSTALLATION_NAME:-My installation}
      RUNNER_URL: http://runner:4311
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-${ARCHIVE_S3_BUCKET:-}}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-${ARCHIVE_S3_ENDPOINT:-}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_SERVER_SIDE_ENCRYPTION: ${STORAGE_S3_SERVER_SIDE_ENCRYPTION:-}
      STORAGE_S3_PRIVATE_BUCKET_CONFIRMED: ${STORAGE_S3_PRIVATE_BUCKET_CONFIRMED:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CONCURRENCY: ${CONCURRENCY:-4}
    volumes:
      - data:/data
      - agent-home:/home/node
      - workspaces:/workspaces
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  runner:
    image: ${CAIRN_IMAGE:-ghcr.io/leo91000/cairn:latest}
    user: '0:0'
    entrypoint: [/usr/local/bin/cairn, runner-broker]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATA_DIR: /data
      CONCURRENCY: ${CONCURRENCY:-4}
    read_only: true
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, NET_ADMIN, SYS_CHROOT, SETUID, SETGID, MKNOD, CHOWN, FOWNER, KILL, DAC_OVERRIDE]
    security_opt: [apparmor:unconfined, seccomp:unconfined]
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/fuse:/dev/fuse
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: '1'
      net.ipv6.conf.all.disable_ipv6: '1'
    tmpfs:
      - /run
      - /tmp
    volumes:
      - data:/data
      - runner-state:/runner-state
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
    mem_limit: 20g
    cpus: 8
volumes:
  runner-state:
  data:
  agent-home:
  workspaces:
