id = "discord"
name = "Discord"
version = "0.5.0"
description = "Mention a bot in your server to start a conversation with one of your agents, or let rules react to what happens in the server."
apiVersion = 2
capabilities = [
  "socket",
  "inbound",
  "conversations.submit",
  "conversations.control",
  "http",
  "storage",
  "hooks",
]
hosts = [
  "discord.com",
  "cdn.discordapp.com",
  "media.discordapp.net",
  "*.discord.gg",
]
instanceForm = true
instanceView = true
instanceTest = true

[brand]
color = "#5865F2"
path = "M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.3 18.3 0 0 0-5.487 0a13 13 0 0 0-.617-1.25a.08.08 0 0 0-.079-.037A19.7 19.7 0 0 0 3.677 4.37a.1.1 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.08.08 0 0 0 .084-.028a14 14 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13 13 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10 10 0 0 0 .372-.292a.07.07 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.07.07 0 0 1 .078.01q.181.149.373.292a.077.077 0 0 1-.006.127a12.3 12.3 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.08.08 0 0 0 .084.028a19.8 19.8 0 0 0 6.002-3.03a.08.08 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03M8.02 15.33c-1.182 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418m7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418"

[instances]
singular = "Bot"
plural = "Bots"

[credential]
label = "Bot token"
header = "authorization"
prefix = "Bot "

[setup]
effort = "token"
summary = "Discord connects a bot you create in the Discord Developer Portal, in about five minutes. Paste its token, invite it to your server, then choose where it answers."

[[setup.steps]]
id = "bot"
kind = "credential"
title = "Bot token"
description = "The token of the bot people will mention. Cairn checks it and gives you its invite link."

[[setup.steps]]
id = "where"
title = "Where it answers"
description = "Invite the bot with the link from the previous step, then refresh to choose its server and channel."
settings = [
  "guildId",
  "channelId",
  "messageContent",
  "everyMessage",
  "memberEvents",
]

[[setup.steps]]
id = "people"
kind = "people"
title = "Who can talk to it"

[[setup.steps]]
id = "agents"
kind = "agents"
title = "Agents for rules"
description = "Agents whose rules may react to what happens in this server. You can restrict each hook to channels later."

[[settings]]
key = "guildId"
title = "Server"
type = "select"
dynamic = true
refresh = true
required = true
pattern = "\\d{1,20}"
maxLength = 20
description = "Servers your bot was invited to."

[[settings]]
key = "channelId"
title = "Channel"
type = "select"
dynamic = true
required = true
pattern = "\\d{1,20}"
maxLength = 20
description = "Where people mention the bot. Each request gets its own thread."
refresh = true

[[settings]]
key = "messageContent"
title = "Read replies without a mention"
type = "boolean"
description = "Replies in the bot’s threads reach it without a mention. Turn on Message Content for the bot in the Developer Portal first."

[[settings]]
key = "everyMessage"
title = "Answer every message in the channel"
type = "boolean"
description = "For support channels: every new message is a request, and the agent stays silent when nothing is needed. Needs Message Content."

[[settings]]
key = "memberEvents"
title = "Members joining and leaving"
type = "boolean"
description = "Rules can react when someone joins or leaves the server. Turn on Server Members Intent for the bot in the Developer Portal first."

[[settings]]
key = "guildName"
title = "Server name"
type = "string"
hidden = true

[[settings]]
key = "channelName"
title = "Channel name"
type = "string"
hidden = true

[[settings]]
key = "botId"
title = "Bot ID"
type = "string"
hidden = true
maxLength = 20

[[settings]]
key = "botName"
title = "Bot name"
type = "string"
hidden = true

[agentAccess]
description = "Off by default. Granted agents' rules can react to what happens in this bot's server: messages, edits, reactions, buttons, threads, channels and members. Restrict each hook to channels or threads when you grant it."

[[resources]]
name = "server"
description = "The Discord server the bot was set up in."

[[resources]]
name = "channel"
description = "A channel of the server."
parentType = "server"

[[resources]]
name = "thread"
description = "A thread of a channel."
parentType = "channel"

[[resources]]
name = "person"
description = "A member of the server."

[[hooks]]
name = "message"
title = "A message is posted"
description = "A message is posted in the server. Its text needs Message Content unless it mentions the bot. The bot's own messages are not included."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/authorId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "messageId",
  "guildId",
  "channelId",
  "authorId",
  "authorName",
  "authorBot",
  "text",
  "mentionsBot",
]

[hooks.payloadSchema.properties]
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }
authorId = { type = "string", description = "Who wrote it." }
authorName = { type = "string", description = "Their display name." }
authorBot = { type = "boolean", description = "Whether another bot or a webhook wrote it." }
text = { type = "string", description = "What the message says; empty without Message Content unless it mentions the bot." }
mentionsBot = { type = "boolean", description = "Whether it mentions the bot." }
replyToId = { type = "string", description = "The message it replies to." }
url = { type = "string", description = "A link to the message." }
createdAt = { type = "string", description = "When it was posted (ISO 8601)." }

[hooks.payloadSchema.properties.attachments]
type = "array"
description = "Up to four attached files."
maxItems = 4

[hooks.payloadSchema.properties.attachments.items]
type = "object"
properties = { name = { type = "string" }, url = { type = "string" }, contentType = { type = "string" }, size = { type = "integer" } }

[[hooks]]
name = "message-edited"
title = "A message is edited"
description = "A message of the server is edited. Its new text needs Message Content."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/authorId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "messageId",
  "guildId",
  "channelId",
]

[hooks.payloadSchema.properties]
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }
authorId = { type = "string", description = "Who wrote it, when Discord says." }
authorName = { type = "string", description = "Their display name." }
text = { type = "string", description = "The new text, when Discord sends it." }
editedAt = { type = "string", description = "When it was edited (ISO 8601)." }
url = { type = "string", description = "A link to the message." }

[[hooks]]
name = "message-deleted"
title = "A message is deleted"
description = "A message of the server is deleted."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "messageId",
  "guildId",
  "channelId",
]

[hooks.payloadSchema.properties]
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }

[[hooks]]
name = "reaction-added"
title = "Someone reacts to a message"
description = "Someone adds a reaction to a message of the server."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/userId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "messageId",
  "guildId",
  "channelId",
  "userId",
  "emoji",
]

[hooks.payloadSchema.properties]
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }
userId = { type = "string", description = "Who reacted." }
userName = { type = "string", description = "Their display name, when Discord says." }
emoji = { type = "string", description = "The emoji: the character itself, or name:id for a custom emoji." }
emojiName = { type = "string", description = "The emoji's name or character." }
messageAuthorId = { type = "string", description = "Who wrote the message, when Discord says." }

[[hooks]]
name = "reaction-removed"
title = "A reaction is removed"
description = "Someone removes their reaction from a message of the server."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/userId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "messageId",
  "guildId",
  "channelId",
  "userId",
  "emoji",
]

[hooks.payloadSchema.properties]
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }
userId = { type = "string", description = "Who reacted." }
userName = { type = "string", description = "Their display name, when Discord says." }
emoji = { type = "string", description = "The emoji: the character itself, or name:id for a custom emoji." }
emojiName = { type = "string", description = "The emoji's name or character." }

[[hooks]]
name = "button-pressed"
title = "A button is pressed"
description = "Someone presses a button on one of the bot's messages. The bot acknowledges it at once."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/userId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "interactionId",
  "customId",
  "messageId",
  "guildId",
  "channelId",
  "userId",
  "userName",
]

[hooks.payloadSchema.properties]
interactionId = { type = "string", description = "The press." }
customId = { type = "string", description = "The button's identifier." }
messageId = { type = "string", description = "The message's ID." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel, or the parent channel of a thread." }
threadId = { type = "string", description = "The thread, when the message is in one." }
userId = { type = "string", description = "Who pressed it." }
userName = { type = "string", description = "Their display name." }

[[hooks]]
name = "thread-created"
title = "A thread is created"
description = "A thread is created in the server."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
  { path = "/threadId", resourceType = "thread" },
  { path = "/ownerId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "threadId",
  "guildId",
  "channelId",
  "name",
]

[hooks.payloadSchema.properties]
threadId = { type = "string", description = "The new thread." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel it belongs to." }
name = { type = "string", description = "Its name." }
ownerId = { type = "string", description = "Who created it." }

[[hooks]]
name = "thread-deleted"
title = "A thread is deleted"
description = "A thread of the server is deleted."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "threadId",
  "guildId",
  "channelId",
]

[hooks.payloadSchema.properties]
threadId = { type = "string", description = "The deleted thread." }
guildId = { type = "string", description = "The server." }
channelId = { type = "string", description = "The channel it belonged to." }

[[hooks]]
name = "channel-created"
title = "A channel is created"
description = "A channel is created in the server."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/channelId", resourceType = "channel" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "channelId",
  "guildId",
  "name",
  "kind",
]

[hooks.payloadSchema.properties]
channelId = { type = "string", description = "The new channel." }
guildId = { type = "string", description = "The server." }
name = { type = "string", description = "Its name." }
kind = { type = "string", description = "text, voice, announcement, forum, stage, media or category." }
categoryId = { type = "string", description = "Its category, when it has one." }

[[hooks]]
name = "channel-deleted"
title = "A channel is deleted"
description = "A channel of the server is deleted."
resourceFields = [ { path = "/guildId", resourceType = "server" }, ]

[hooks.payloadSchema]
type = "object"
required = [
  "channelId",
  "guildId",
  "name",
]

[hooks.payloadSchema.properties]
channelId = { type = "string", description = "The deleted channel." }
guildId = { type = "string", description = "The server." }
name = { type = "string", description = "Its name." }

[[hooks]]
name = "member-joined"
title = "Someone joins the server"
description = "Someone joins the server. Needs “Members joining and leaving”."
resourceFields = [
  { path = "/guildId", resourceType = "server" },
  { path = "/userId", resourceType = "person" },
]

[hooks.payloadSchema]
type = "object"
required = [
  "userId",
  "userName",
  "guildId",
  "bot",
]

[hooks.payloadSchema.properties]
userId = { type = "string", description = "The member." }
userName = { type = "string", description = "Their display name." }
guildId = { type = "string", description = "The server." }
bot = { type = "boolean", description = "Whether the member is a bot." }
joinedAt = { type = "string", description = "When they joined (ISO 8601)." }

[[hooks]]
name = "member-left"
title = "Someone leaves the server"
description = "Someone leaves or is removed from the server. Needs “Members joining and leaving”."
resourceFields = [ { path = "/guildId", resourceType = "server" }, ]

[hooks.payloadSchema]
type = "object"
required = [
  "userId",
  "userName",
  "guildId",
  "bot",
]

[hooks.payloadSchema.properties]
userId = { type = "string", description = "The member." }
userName = { type = "string", description = "Their display name." }
guildId = { type = "string", description = "The server." }
bot = { type = "boolean", description = "Whether the member is a bot." }
