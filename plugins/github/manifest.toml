attempt = { type = "integer", description = "Its attempt." }
workflow = { type = "string", description = "The workflow's name." }
conclusion = { type = "string", description = "success, failure, cancelled, skipped, timed_out, neutral or action_required." }
branch = { type = "string", description = "The branch it ran on." }
headSha = { type = "string", description = "The commit it ran on." }
event = { type = "string", description = "What started it, such as push or pull_request." }
actorLogin = { type = "string", description = "Who started it." }
pullRequests = { type = "array", description = "Numbers of the pull requests it ran for." }
url = { type = "string", description = "A link to the run." }
completedAt = { type = "string", description = "When it finished (ISO 8601)." }

[[hooks]]
name = "notification"
title = "You are asked for a review, mentioned or assigned"
description = "A notification reaches this account: a review request, a mention, an assignment or activity it follows. Needs “Notifications for rules”."
resourceFields = [ { path = "/repository", resourceType = "repository" }, ]

[hooks.payloadSchema]
type = "object"
required = [
  "threadId",
  "reason",
  "title",
  "repository",
  "type",
]

[hooks.payloadSchema.properties]
threadId = { type = "string", description = "The notification thread." }
reason = { type = "string", description = "review_requested, mention, team_mention, assign, author, comment, ci_activity, state_change, subscribed…" }
title = { type = "string", description = "What it is about." }
type = { type = "string", description = "PullRequest, Issue, Release, Commit, Discussion, CheckSuite…" }
repository = { type = "string", description = "owner/name." }
number = { type = "integer", description = "The issue or pull request's number, when it is one." }
url = { type = "string", description = "A link to it on GitHub." }
updatedAt = { type = "string", description = "When it was updated (ISO 8601)." }
