id = "onepassword"
name = "1Password"
version = "1.3.0"
description = "Agents pipe secrets straight into commands. Values never appear in the conversation."
apiVersion = 2
capabilities = [
  "http",
  "exec",
]
instanceTest = true
instanceView = true
instructions = "1Password: Discover authorized accounts and field references using cairn_workspace.onepassword or cairn plugin onepassword. Read secrets only with cairn plugin onepassword read --account ACCOUNT_ID op://vault/item/field and pipe stdout directly into the consuming command, or capture it inside a script without printing it. For multiple fields of the same item, use cairn plugin onepassword read-fields --account ACCOUNT_ID --vault VAULT --item ITEM --fields '[\"username\",\"credential\"]': it returns a secret JSON object in one item read. Reuse those values in memory for the bounded script instead of reading them for every API request; never persist them or share them between runs. Check quotas with cairn plugin onepassword limits --account ACCOUNT_ID. If rate limited, stop retrying until the reported reset; the daily quota is shared by all service accounts of the 1Password account, so reconnecting or rotating tokens does not reset it. Never run a bare read or read-fields that exposes stdout to the conversation. When the owner allowed writing for an account, create items with cairn plugin onepassword create-item --account ACCOUNT_ID --vault VAULT --category CATEGORY --title TITLE --fields JSON and change or add fields with cairn plugin onepassword set-fields --account ACCOUNT_ID --vault VAULT --item ITEM --fields JSON, where JSON is an array of {\"field\": ID or label, \"value\": text, \"type\": optional STRING, CONCEALED, EMAIL, URL, PHONE or OTP}. Build that compact JSON (jq -c) inside a script from a variable or command substitution, for example generated with openssl or captured from another command, so secret values never appear literally in the command text. accounts reports which accounts allow writing. Writes return field references, never values; they never delete items. set-fields edits only Password, API Credential, Server, Database, Secure Note, Software License, Wireless Router and Email Account items without attachments; a CLI rewrite could damage others, such as passkeys in Login items. After an uncertain create-item failure, list the vault's items before retrying so you do not create a duplicate. The server holds service account tokens; do not expect an authenticated op CLI in this VM. Never print credentials, use shell tracing around them, type their literal values in command text, or include them in messages or artifacts. This integration cannot use passkeys. If a website requires a passkey, stop that sign-in and ask the user to configure TOTP in the matching 1Password item if supported; wait for confirmation. Never request passwords, TOTP seeds or recovery codes in chat."
hosts = [
  "app-updates.agilebits.com",
  "cache.agilebits.com",
]

[[programs]]
name = "op"
description = "The 1Password CLI with an isolated encrypted in-memory cache per connection, shared by its authorized agents and cleared after ten idle minutes."
installer = "programs/op.luau"
cache = { daemonArgs = [
  "daemon",
  "--timeout",
  "0"
], socketEnv = "OP_SOCK" }

[instances]
singular = "Service account"
plural = "Service accounts"

[brand]
color = "#1A285F"
path = "M12 0c6.627 0 12 5.373 12 12c0 6.628-5.373 12-12 12S0 18.628 0 12C0 5.373 5.373 0 12 0m-.893 4.86c-.485 0-.727.001-.913.095a.87.87 0 0 0-.378.379c-.094.185-.095.428-.095.912v2.747c0 .12 0 .182.016.238q.02.075.065.138a1 1 0 0 0 .175.162l.695.564c.113.092.17.139.19.194a.22.22 0 0 1 0 .15c-.02.056-.077.102-.19.194l-.695.564a1 1 0 0 0-.175.162a.4.4 0 0 0-.065.138a1 1 0 0 0-.016.238v6.019c0 .485 0 .728.095.913a.87.87 0 0 0 .378.378c.186.094.428.094.913.094h1.786c.485 0 .727 0 .913-.094a.87.87 0 0 0 .378-.378c.095-.185.095-.428.095-.913v-2.747c0-.12 0-.182-.016-.238a.4.4 0 0 0-.065-.138a1 1 0 0 0-.175-.162l-.695-.564c-.113-.092-.17-.138-.191-.193a.22.22 0 0 1 0-.152c.02-.055.078-.1.19-.193l.696-.564a1 1 0 0 0 .175-.162a.4.4 0 0 0 .065-.138a1 1 0 0 0 .016-.238V6.246c0-.484 0-.727-.095-.912a.87.87 0 0 0-.378-.379c-.186-.094-.428-.094-.913-.094Z"

[setup]
summary = "1Password connects through a service account you create in 1Password, with read access to the vaults agents may use. Writing is off unless you allow it here and grant write access in 1Password."

[[setup.steps]]
id = "token"
title = "Service account token"
settings = [ "token" ]

[[setup.steps.checklist]]
title = "Create a service account"
text = "In 1Password, create a service account and give it read access to the vaults agents may use. Copy its token, which starts with ops_."
url = "https://developer.1password.com/docs/service-accounts/get-started/"
link = "Open the guide"

[[setup.steps]]
id = "permissions"
title = "Permissions"
settings = [ "allowWrite" ]

[[setup.steps]]
id = "agents"
kind = "agents"
title = "Agents"

[[settings]]
key = "token"
title = "Service account token"
type = "secret"
required = true
pattern = "ops_\\S+"
maxLength = 16384
placeholder = "ops_…"
description = "Encrypted on the server and never shown again. Agents read unless you allow writing in the permissions; choose the vault permissions in 1Password."

[[settings]]
key = "allowWrite"
title = "Create items and edit fields"
type = "boolean"
default = false
risk = "high"
ownerOnly = true
description = "Lets granted agents create items and change fields in the vaults this service account can write to. Agents never delete items. 1Password permissions still apply."

[agentAccess]
description = "Off by default, including for Main agent. Removing an agent blocks its next reads immediately; secrets already read cannot be recalled."

[[commands]]
name = "accounts"
description = "List the 1Password accounts this agent may use."

[[commands]]
name = "limits"
description = "Show hourly and daily quota usage and seconds until reset, without reading secrets."
arguments = [ { name = "account", flag = "--account", required = true, maxLength = 100 }, ]

[[commands]]
name = "vaults"
description = "List the vaults of an account."
arguments = [ { name = "account", flag = "--account", required = true, maxLength = 100 }, ]

[[commands]]
name = "items"
description = "List the items of a vault."
arguments = [
  { name = "account", flag = "--account", required = true, maxLength = 100 },
  { name = "vault", flag = "--vault", required = true, maxLength = 200 },
]

[[commands]]
name = "fields"
description = "List an item's field references, without their values."
arguments = [
  { name = "account", flag = "--account", required = true, maxLength = 100 },
  { name = "vault", flag = "--vault", required = true, maxLength = 200 },
  { name = "item", flag = "--item", required = true, maxLength = 200 },
]

[[commands]]
name = "read-fields"
description = "Write selected fields of one item as secret JSON for a pipe, with one item read and no plaintext cache. TOTP fields require read."
output = "secret"
arguments = [
  { name = "account", flag = "--account", required = true, maxLength = 100 },
  { name = "vault", flag = "--vault", required = true, maxLength = 200 },
  { name = "item", flag = "--item", required = true, maxLength = 200 },
  { name = "fields", flag = "--fields", required = true, maxLength = 8000, description = "JSON array of 1 to 32 distinct field IDs or labels. Output keys match this selection." },
]

[[commands]]
name = "read"
description = "Write one secret to stdout for a pipe, without a trailing newline."
output = "secret"

[[commands.arguments]]
name = "account"
flag = "--account"
required = true
maxLength = 100

[[commands.arguments]]
name = "reference"
positional = true
required = true
pattern = "op://.+"
maxLength = 2000
description = "An op://vault/item/field reference."

[[commands]]
name = "create-item"
description = "Create an item when the owner allowed writing. Returns its field references, never values."
arguments = [
  { name = "account", flag = "--account", required = true, maxLength = 100 },
  { name = "vault", flag = "--vault", required = true, maxLength = 200 },
  { name = "category", flag = "--category", required = true, maxLength = 100, pattern = "[A-Za-z][A-Za-z _]*", description = "An item category such as Login, Password, API Credential, Secure Note, Server or Database. Documents can't be created." },
  { name = "title", flag = "--title", required = true, maxLength = 200 },
  { name = "fields", flag = "--fields", maxLength = 10000, description = "JSON array of up to 32 {\"field\", \"value\", \"type\"?} objects. Build it from variables so values never appear in the command text." },
  { name = "url", flag = "--url", maxLength = 2000, pattern = "https?://.+" },
]

[[commands]]
name = "set-fields"
description = "Change or add fields of an item when the owner allowed writing. Login, Document and SSH Key items, other categories and items with attachments are refused. Returns field references, never values."
arguments = [
  { name = "account", flag = "--account", required = true, maxLength = 100 },
  { name = "vault", flag = "--vault", required = true, maxLength = 200 },
  { name = "item", flag = "--item", required = true, maxLength = 200 },
  { name = "fields", flag = "--fields", required = true, maxLength = 10000, description = "JSON array of 1 to 32 {\"field\", \"value\", \"type\"?} objects. Build it from variables so values never appear in the command text." },
]

[[tools]]
name = "onepassword"
description = "Read-only 1Password metadata. items requires vault; fields requires vault and item and returns field references without values. Secret reads are available only through the Cairn plugin CLI for direct piping into commands."

[tools.inputSchema]
type = "object"
required = [ "operation", ]
additionalProperties = false

[tools.inputSchema.properties.operation]
type = "string"
enum = [
  "accounts",
  "limits",
  "vaults",
  "items",
  "fields",
]

[tools.inputSchema.properties.accountId]
type = "string"
minLength = 1
maxLength = 100

[tools.inputSchema.properties.vault]
type = "string"
minLength = 1
maxLength = 200

[tools.inputSchema.properties.item]
type = "string"
minLength = 1
maxLength = 200
