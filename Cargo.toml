[workspace]
members = [
  "crates/contracts",
  "crates/installation",
  "crates/beacon",
  "crates/node-gateway",
  "crates/protocol",
  "crates/plugin-api",
  "crates/plugin-host",
  "crates/plugin-runtime"
]
resolver = "3"
exclude = [
  "vendor/rtc-dtls",
  "vendor/rtc-sctp",
  "vendor/rtc",
  "vendor/webrtc"
]

[patch.crates-io]
# Register local channel event receivers before the driver can announce them.
webrtc = { path = "vendor/webrtc" }
# Reserve a closing channel until SCTP actually releases its wire stream.
rtc = { path = "vendor/rtc" }
# Keep stream resets from closing replacement channels on the pinned stack.
rtc-sctp = { path = "vendor/rtc-sctp" }
# Preserve the pinned 0.21.0 stack; fix only DTLS retransmission under loss.
rtc-dtls = { path = "vendor/rtc-dtls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"
