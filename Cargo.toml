[workspace]
members = [
  "crates/installation",
  "crates/beacon",
  "crates/protocol"
]
resolver = "3"
exclude = [ "vendor/rtc-dtls" ]

[patch.crates-io]
# Preserve the pinned 0.21.0 stack; fix only DTLS retransmission under loss.
rtc-dtls = { path = "vendor/rtc-dtls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"
