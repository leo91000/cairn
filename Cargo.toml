[workspace]
members = [
  "crates/installation",
  "crates/beacon",
  "crates/node-gateway",
  "crates/protocol",
  "crates/plugin-api",
  "crates/plugin-host",
  "crates/plugin-runtime"
]
resolver = "3"
exclude = [
  "vendor/rtc-dtls",
  "vendor/ext4-view"
]

[patch.crates-io]
# Correct circular journal replay and revocations without changing the reader version.
ext4-view = { path = "vendor/ext4-view" }
# Preserve the pinned 0.21.0 stack; fix only DTLS retransmission under loss.
rtc-dtls = { path = "vendor/rtc-dtls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"
