[workspace]
members = [
  "crates/installation",
  "crates/beacon",
  "crates/protocol",
  "crates/plugin-api",
  "crates/plugin-host",
  "crates/plugin-runtime"
]
resolver = "3"
exclude = [
  "vendor/rtc-dtls",
  "vendor/vhost-user-backend"
]

[patch.crates-io]
# Preserve the pinned 0.21.0 stack; fix only DTLS retransmission under loss.
rtc-dtls = { path = "vendor/rtc-dtls" }
# Preserve 0.23.0; keep the VM shutdown event owned until its worker stops.
vhost-user-backend = { path = "vendor/vhost-user-backend" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"
