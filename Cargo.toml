[workspace]
members = [
  "crates/installation",
  "crates/beacon",
  "crates/node-gateway",
  "crates/protocol",
  "crates/plugin-api",
  "crates/plugin-host",
  "crates/plugin-runtime"
]
resolver = "3"
exclude = [
  "vendor/rtc-dtls",
  "vendor/ext4-view"
]

[patch.crates-io]
# Correct circular journal replay and revocations without changing the reader version.
ext4-view = { path = "vendor/ext4-view" }
# Preserve the pinned 0.21.0 stack; fix only DTLS retransmission under loss.
rtc-dtls = { path = "vendor/rtc-dtls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep third-party crates on the existing release profile. The measured four-unit
# profile applies only to Cairn's workspace packages.
[profile.release.package.cairn-installation]
codegen-units = 4

[profile.release.package.cairn-beacon]
codegen-units = 4

[profile.release.package.cairn-protocol]
codegen-units = 4

[profile.release.package.cairn-plugin-api]
codegen-units = 4

[profile.release.package.cairn-plugin-host]
codegen-units = 4

[profile.release.package.cairn-plugin-runtime]
codegen-units = 4

[profile.bench]
lto = "thin"
